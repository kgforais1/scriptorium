[package]
name = "scriptorium"
version = "0.1.0"
description = "Scriptorium — Tauri-first app for scanned-page virtual books"
authors = ["kgforais1"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scriptorium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jsonschema = "0.51.0"
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.55", default-features = false, features = ["parsing", "formatting", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }
tiff = "0.11.3"
lcms2 = { version = "6.2.0", features = ["static"] }
jpeg2k = { version = "0.10.1", default-features = false, features = ["openjpeg-sys"] }
zune-jpeg = "0.5"
zune-core = "0.5"
sha2 = "0.11.1"
fs4 = "1.1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
