[package]
name = "scriptorium"
version = "0.2.0"
description = "Scriptorium — Tauri-first app for scanned-page virtual books"
authors = ["kgforais1"]
# PolyForm Shield 1.0.0 has no SPDX identifier, so cargo points at the file.
license-file = "../LICENSE"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scriptorium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jsonschema = { version = "0.51.0", default-features = false }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.3"
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.55", default-features = false, features = ["parsing", "formatting", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }
tiff = "0.11.3"
lcms2 = { version = "6.2.0", features = ["static"] }
jpeg2k = { version = "0.10.1", default-features = false, features = ["openjpeg-sys"] }
zune-jpeg = "0.5"
zune-core = "0.5"
sha2 = "0.11.1"
fs4 = "1.1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `missing_docs` is set in src/lib.rs so it covers the lib crate only (not build.rs or main.rs).
[lints.clippy]
cognitive_complexity = "warn"

# OpenJPEG 2.5.3, bundled by openjpeg-sys 1.0.12, has CVE-2025-54874. Until an openjpeg-sys
# release bundles 2.5.4, build from a fork commit that bumps only the vendored C sources.
# Upstream PR: https://github.com/Enet4/openjpeg-sys/pull/5. Drop this patch once a release has it.
[patch.crates-io]
openjpeg-sys = { git = "https://github.com/kgrizz-git/openjpeg-sys", rev = "1e04bc79c120ca63b2fcc53a0f20166316234edd" }
