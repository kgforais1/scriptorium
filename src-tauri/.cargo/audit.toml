# cargo-audit config for the Tauri crate (discovered as src-tauri/.cargo/audit.toml
# when CI runs cargo-audit with working-directory: src-tauri).
#
# RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g is informational = unsound
# (glib::VariantStrIter, glib >=0.15.0, <0.20.0). Tauri 2.12.5 still requires
# gtk 0.18.2, which requires glib 0.18.5, and glib 0.20 has the fix.
# cargo audit prints that warning and exits 0. Do not ignore it: the runbook
# says not to suppress a warning to clear Dependency audit.
#
# A real vulnerability ignore is time-bound in audit-exceptions.toml.

[advisories]
ignore = []
