# .pre-commit-config.yaml
#
# Install both hook types (commit + push):
#   pip install pre-commit
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Update hook revisions:
#   pre-commit autoupdate
#
# Run manually:
#   pre-commit run --all-files
#   pre-commit run --all-files --hook-stage pre-push
#
# See hooks/README.md and docs/ci-and-hooks.md.

default_stages: [pre-commit]

repos:
  # ── Harness policy checks ──────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: check-file-size
        name: "policy: file size & counts"
        entry: python hooks/scripts/check_file_size.py
        language: python
        types: [file]
        pass_filenames: true
        description: "Enforces policies/file-size-and-counts.md (line caps, binary limits)."

      - id: check-doc-freshness
        name: "policy: doc freshness"
        entry: python hooks/scripts/check_doc_freshness.py
        language: python
        types: [markdown]
        pass_filenames: true
        description: "Enforces policies/doc-freshness.md (Last reviewed marker + staleness)."

      - id: check-todo-limits
        name: "policy: TODO / to_do size"
        entry: python hooks/scripts/check_todo_limits.py
        language: python
        files: '(^|/)(to_do|TODO|todo|TO_DO|backlog)\.md$'
        pass_filenames: true
        description: "Warns/blocks oversized living backlog files (policies/plans-and-todos.md)."

      - id: check-todo-plan-sync
        name: "policy: to_do ↔ plans sync"
        entry: python hooks/scripts/check_todo_plan_sync.py
        language: python
        files: '(^|/)(to_do|TODO|todo|TO_DO|backlog)\.md$|^plans/.*\.md$'
        pass_filenames: false
        always_run: false
        description: "Advisory: Next Up count, active plan links, stale archive refs (policies/plans-and-todos.md)."

      # Typecheck on push (slower than lint; still catches errors before CI).
      - id: basedpyright
        name: "types: basedpyright"
        entry: basedpyright
        language: python
        additional_dependencies: [basedpyright==1.29.4]
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        description: "Python type check (pyrightconfig.json). Also runs in CI."

      # Optional: uncomment if your team uses gitignored backups/ before edits
      # - id: prune-backups
      #   name: "hygiene: prune old backups/"
      #   entry: bash hooks/scripts/prune_backups.sh
      #   language: system
      #   pass_filenames: false
      #   always_run: true

      # Optional: cleanup hygiene check for completed work artifacts
      # - id: check-cleanup-hygiene
      #   name: "hygiene: cleanup completed work"
      #   entry: python hooks/scripts/check_cleanup_hygiene.py
      #   language: python
      #   pass_filenames: false
      #   always_run: true

  # ── Secret scanning (always on) ────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: "secrets: gitleaks scan"

  # ── General file hygiene ───────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=5120]
        name: "size: large file gate"
      - id: detect-private-key
        name: "secrets: private key detect"
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
        # tsconfig*.json are JSONC (comments allowed by tsc); plain JSON parse fails
        exclude: '(^|/)tsconfig[^/]*\.json$'
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

  # ── Python ─────────────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        name: "python: ruff lint"
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: "python: ruff format"

  # ── Markdown ───────────────────────────────────────────────────────────────
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2
        name: "docs: markdownlint"

  # ── Shell ──────────────────────────────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: "shell: shellcheck"
