# tesseract.yml — packaging proof for the self-contained Tesseract sidecar (M2a Phase 1), plus
# the manual release that publishes the binaries (M2a Phase 3, Chunk 1).
# Runs on PRs that touch the build script, this workflow, or the smoke image, and on demand.
# A workflow_dispatch run with a release_tag also publishes the three binaries as release assets.
# Action refs are pinned to full commit SHAs.

name: Tesseract build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Tag to publish the binaries under (for example tesseract-5.5.3-r1). Required: a dispatch
          creates that public release. Leave the workflow on a PR run to only build and test.
        required: true
        type: string
  pull_request:
    paths:
      - scripts/build_tesseract.sh
      - .github/workflows/tesseract.yml
      - tests/fixtures/ocr/smoke.png

permissions:
  contents: read

jobs:
  build:
    name: Build and run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A full build takes about 7 minutes. The cap stops a hung build early.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on 22.04 (glibc 2.35), so the binary also runs on older distributions.
        os: [macos-latest, ubuntu-22.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Windows builds inside MSYS2 MinGW64; the other runners use their own toolchain.
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          cache: false
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm mingw-w64-x86_64-binutils mingw-w64-x86_64-rust curl tar

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake nasm

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake nasm

      - name: Build Tesseract
        if: runner.os != 'Windows'
        run: bash scripts/build_tesseract.sh

      - name: Build Tesseract (MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          # The app's Windows target is MSVC, but rustc inside MSYS2 reports x86_64-pc-windows-gnu.
          # Name the output for the triple the app bundles it under.
          TESSERACT_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: bash scripts/build_tesseract.sh

      # The published asset is the bare binary, and its name is the one the app bundles, so a
      # change in the triple or the .exe suffix must fail here and not in a consumer's fetch.
      - name: Check the asset name
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            macOS) expected="tesseract-aarch64-apple-darwin" ;;
            Linux) expected="tesseract-x86_64-unknown-linux-gnu" ;;
            Windows) expected="tesseract-x86_64-pc-windows-msvc.exe" ;;
          esac
          ls -l src-tauri/binaries/
          bin="$(ls src-tauri/binaries/tesseract-*)"
          if [ "${bin}" != "src-tauri/binaries/${expected}" ]; then
            echo "expected only src-tauri/binaries/${expected}, found: ${bin}" >&2
            exit 1
          fi

      # The .exe must not load the MinGW runtime next to it, or the sidecar fails on a machine
      # without MSYS2. Git Bash has no objdump, so this runs in the MSYS2 shell.
      - name: Check the Windows binary for MinGW runtime DLLs
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          exe="src-tauri/binaries/tesseract-x86_64-pc-windows-msvc.exe"
          imports="$(objdump -p "${exe}" | grep -i 'DLL Name')"
          echo "${imports}"
          status=0
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            if echo "${imports}" | grep -qiF "${dll}"; then
              echo "${exe} imports ${dll}; link it statically" >&2
              status=1
            fi
          done
          exit "${status}"

      # Windows 10 1903 and later read narrow paths in the process code page named here. Without
      # it, std::filesystem and Tesseract's own file opens use the ANSI code page, so a non-ASCII
      # --tessdata-dir fails. The manifest is plain XML inside the exe, so strings finds it
      # whatever form windres or objdump would print it in.
      - name: Check the Windows binary embeds the UTF-8 manifest
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          exe="src-tauri/binaries/tesseract-x86_64-pc-windows-msvc.exe"
          text="$(strings -n 8 "${exe}")"
          # Two manifests (ours and a toolchain default) are not allowed: some ld versions
          # reject the link, and the ones that merge it leave Windows free to pick.
          count="$(grep -c '<assembly' <<< "${text}" || true)"
          grep '<assembly\|activeCodePage' <<< "${text}" || true
          if [ "${count}" -ne 1 ]; then
            echo "${exe} must embed exactly one manifest, found ${count}" >&2
            exit 1
          fi
          if ! grep -q 'activeCodePage[^>]*>UTF-8<' <<< "${text}"; then
            echo "${exe} does not ask for UTF-8 as the process code page" >&2
            exit 1
          fi

      - name: Run the binary from a non-ASCII directory with no system Tesseract
        run: |
          set -euo pipefail
          bin="$(ls src-tauri/binaries/tesseract-*)"
          bin="${PWD}/${bin}"
          # Fail if a system Tesseract is visible on PATH.
          if command -v tesseract > /dev/null 2>&1; then
            echo "system tesseract on PATH"; exit 1
          fi
          mkdir -p tmp/tessdata
          curl --proto "=https" --proto-redir "=https" --tlsv1.2 --fail --silent --show-error --location \
            --output tmp/tessdata/eng.traineddata \
            https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata
          echo "7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2  tmp/tessdata/eng.traineddata" > tmp/eng.sha256
          if command -v sha256sum > /dev/null 2>&1; then sha256sum -c tmp/eng.sha256; else shasum -a 256 -c tmp/eng.sha256; fi
          # A non-ASCII working directory and --tessdata-dir is the Windows bug this covers:
          # narrow paths are read in the ANSI code page unless the exe's manifest asks for UTF-8.
          dir="tmp/scriptorium-ocr-tést"
          rm -rf "${dir}"
          mkdir -p "${dir}"
          cp tests/fixtures/ocr/smoke.png "${dir}/smoke.png"
          cp tmp/tessdata/eng.traineddata "${dir}/eng.traineddata"
          # A native program needs the host's own path form; MSYS prints it with -W.
          case "${RUNNER_OS}" in
            Windows) tessdata="$(cd "${dir}" && { pwd -W 2> /dev/null || cygpath -w "$(pwd)"; })" ;;
            *) tessdata="${PWD}/${dir}" ;;
          esac
          cd "${dir}"
          # TSV mode, as the app runs it: options set directly, no configs/tsv file. The image is
          # a bare name beside the working directory, as the app passes it.
          "${bin}" smoke.png smoke --tessdata-dir "${tessdata}" \
            --psm 3 --oem 1 -c tessedit_create_tsv=1 -c tessedit_create_txt=0
          cat smoke.tsv
          head -1 smoke.tsv | grep -q "^level"
          grep -qi "PRINCESS" smoke.tsv

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tesseract-${{ matrix.os }}
          path: src-tauri/binaries/tesseract-*
          if-no-files-found: error
          # A re-run job uploads under the same name.
          overwrite: true

  # Gathers the three binaries into the release layout on every run, so a PR exercises these
  # checks before any publish depends on them.
  assets:
    name: Gather the release assets
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets

      # Each artifact must hold exactly one file with the expected asset name, so the release and
      # the hashes pinned in scripts/fetch_tesseract.sh cannot drift apart.
      - name: Check the artifacts and write SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p release
          while read -r artifact asset; do
            found="$(ls -A "assets/${artifact}")"
            if [ "${found}" != "${asset}" ]; then
              echo "assets/${artifact}: expected only ${asset}, found: ${found:-nothing}" >&2
              exit 1
            fi
            cp "assets/${artifact}/${asset}" "release/${asset}"
          done <<'EOF'
          tesseract-macos-latest tesseract-aarch64-apple-darwin
          tesseract-ubuntu-22.04 tesseract-x86_64-unknown-linux-gnu
          tesseract-windows-latest tesseract-x86_64-pc-windows-msvc.exe
          EOF
          cd release
          sha256sum tesseract-aarch64-apple-darwin tesseract-x86_64-unknown-linux-gnu \
            tesseract-x86_64-pc-windows-msvc.exe | tee SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          overwrite: true

  # Publishing is manual: dispatching a run with a release_tag creates a public release, so the
  # user approves each publish. See decision 2 in plans/2026-11-19-m2a-phase3-tesseract.md.
  publish:
    name: Publish the binaries
    if: github.event_name == 'workflow_dispatch'
    needs: [assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # One publish at a time: two runs must not race on the same tag.
    concurrency:
      group: tesseract-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment so the tag is never spliced into this script.
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The tag must point at a merged commit, never at a branch's. Compare the full ref, so a
          # tag named like the default branch is refused too.
          if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "publish from refs/heads/${DEFAULT_BRANCH}, not ${GITHUB_REF}" >&2
            exit 1
          fi
          # A mistyped tag would publish assets under a name no fetch pin points at.
          if ! [[ "${RELEASE_TAG}" =~ ^tesseract-[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]]; then
            echo "release_tag must look like tesseract-5.5.3-r1, got: ${RELEASE_TAG}" >&2
            exit 1
          fi
          # An existing release or tag is refused: a release's assets are what fetch_tesseract.sh's
          # pinned hashes point at, and gh would reuse a bare tag that may point at other source.
          # Bump the r number instead.
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1 ||
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            echo "release or tag ${RELEASE_TAG} already exists; publish a new tag instead" >&2
            exit 1
          fi
          # --latest=false keeps README's /releases/latest link on the app's release.
          # Create an empty draft first, so a failed upload leaves no public release with missing
          # assets. The tag points at the dispatched commit. --target works with --repo and needs
          # no checkout.
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --latest=false \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TAG}" \
            --notes "Self-contained Tesseract binaries for the Scriptorium sidecar, one per supported target. SHA256SUMS lists the hashes pinned in scripts/fetch_tesseract.sh."
          # From here this run owns the draft. If anything fails, delete it and its tag, so a retry
          # can reuse the same tag instead of forcing a new r number and new pins. The trap is set
          # only now, so a failed create never deletes a release someone else made.
          trap 'echo "removing draft ${RELEASE_TAG}" >&2; gh release delete "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes || true' ERR
          gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            release/tesseract-aarch64-apple-darwin \
            release/tesseract-x86_64-unknown-linux-gnu \
            release/tesseract-x86_64-pc-windows-msvc.exe \
            release/SHA256SUMS
          # Publish only once every asset is there.
          uploaded="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '[.assets[].name] | sort | join(" ")')"
          if [ "${uploaded}" != "SHA256SUMS tesseract-aarch64-apple-darwin tesseract-x86_64-pc-windows-msvc.exe tesseract-x86_64-unknown-linux-gnu" ]; then
            echo "draft ${RELEASE_TAG} has assets: ${uploaded}" >&2
            false
          fi
          # Disarm before publishing. If the edit reports an error after GitHub has already made the
          # release public, deleting it would break every clone, so a failure here only reports.
          trap - ERR
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest=false || {
            echo "publishing ${RELEASE_TAG} reported an error; check its state by hand:" >&2
            gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,assets >&2 || true
            exit 1
          }
