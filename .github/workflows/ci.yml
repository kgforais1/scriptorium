# ci.yml — fast-lane required checks for Scriptorium.
# Target: under ~5 minutes on a cold runner.
# Slow lane (Semgrep schedule): .github/workflows/security.yml
# Action refs are pinned to full commit SHAs; trailing comments keep Dependabot updates working.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy (file size, docs, backlog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: File size & counts (all tracked files)
        run: |
          git ls-files -z | xargs -0 python hooks/scripts/check_file_size.py

      - name: Living backlog size
        run: python hooks/scripts/check_todo_limits.py to_do.md

      - name: Backlog ↔ plans sync (advisory)
        run: python hooks/scripts/check_todo_plan_sync.py to_do.md || true

      - name: Internal documentation links
        run: python ci/scripts/check_doc_links.py --internal-only --strict

      - name: Cargo-audit exception expiry (required)
        run: python ci/scripts/check_audit_exceptions.py

      - name: Doc freshness (advisory on PR)
        if: github.event_name == 'pull_request'
        env:
          POLICY_WARN_AS_ERROR: "0"
        run: |
          git ls-files '*.md' | xargs -r python hooks/scripts/check_doc_freshness.py || true

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Ruff lint (incl. complexity)
        run: |
          pip install ruff==0.11.13
          ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Shellcheck (hooks/scripts)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          # `scandir` is a single path (`find "$INPUT_SCANDIR"`), so each
          # directory needs its own step. A space-separated value silently
          # matches nothing and the action still exits 0.
          scandir: "hooks/scripts"
          severity: warning

      - name: Shellcheck (scripts)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "scripts"
          severity: warning

      - name: Shellcheck (ci/scripts)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "ci/scripts"
          severity: warning

      - name: Markdownlint (maintained docs)
        run: >-
          npx --yes markdownlint-cli2@0.23.0
          "AGENTS.md" "README.md" "CHANGELOG.md" "CHANGELOG.dev.md" "to_do.md"
          "ci/**/*.md" "hooks/**/*.md" "inventory/**/*.md" "policies/**/*.md"
          "prompts/**/*.md" "templates/**/*.md" "plans/**/*.md" "docs/**/*.md"
          "tests/**/*.md"

      - name: Actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          files: .github/workflows/*.yml

      - name: Python policy scripts compile
        run: python -m compileall -q hooks/scripts ci/scripts tests

  typecheck:
    name: Type check (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: basedpyright
        run: |
          pip install basedpyright==1.29.4
          basedpyright

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    # code-quality: write lets the job upload coverage to GitHub Code Quality.
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: pytest + coverage gate
        run: |
          pip install pytest pytest-cov jsonschema rfc3339-validator
          pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

      - name: Upload coverage to Code Quality
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest
          # Required job: an upload problem warns instead of blocking the merge, and the
          # job does not wait for GitHub to process the report.
          fail-on-error: false
          wait-for-processing-timeout: 0

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks detect (full history)
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          mkdir -p /tmp/gitleaks && tar xzf "/tmp/${tarball}" -C /tmp/gitleaks gitleaks
          /tmp/gitleaks/gitleaks detect --redact --no-banner --exit-code 1 --verbose

  rust:
    name: Rust (src-tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri Linux system deps
        # https://v2.tauri.app/start/prerequisites/#linux
        # Cached .debs skip the slow apt download (often 2-6 min). build-essential,
        # curl, wget and file ship with ubuntu-latest. Bump `version` to refresh.
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libxdo-dev
            libssl-dev
            libayatana-appindicator3-dev
            librsvg2-dev
          version: "1"

      - name: Install Rust toolchain
        run: |
          # Respects rust-toolchain.toml (pinned channel + clippy/rustfmt).
          rustup show
          rustup component add clippy rustfmt

      # rust-cache keeps compiled dependencies but drops this crate's own build
      # output and stale files, so each entry stays well under the old ~2.5 GB.
      # Only main saves; PRs restore from it, which keeps PR caches off the 10 GB quota.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: cargo check
        run: cargo check --locked

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable corepack (pnpm)
        working-directory: .
        run: corepack enable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: pnpm install
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: pnpm build
        working-directory: .
        run: pnpm build

      - name: cargo build (embed frontendDist; LC-M2)
        run: cargo build --locked --features tauri/custom-protocol

  rust-coverage:
    # Report only: no floor and not a required check. Linux skips the macOS sips
    # fixtures, so ingest coverage reads low here. continue-on-error keeps an
    # install or tool failure from failing the run.
    # Cost (2026-11-06): about 4 min per run, and about 190 CI runs in 30 days
    # (149 PR, 44 push), so roughly 760 Linux minutes a month, free on a public
    # repo. The lcov artifact is 23 KB for 14 days. Caches: registry plus the
    # 1.7 MB binary. target/ is not cached: the first combined entry was 982 MB,
    # of which the registry is ~110 MB, and the repo's caches were already past
    # GitHub's 10 GB limit.
    name: Rust coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      code-quality: write
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri Linux system deps
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libxdo-dev
            libssl-dev
            libayatana-appindicator3-dev
            librsvg2-dev
          version: "1"

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup component add llvm-tools-preview

      # Own key, registry only: the instrumented target dir is ~1 GB and is not cached.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-llvm-cov-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-llvm-cov-${{ runner.os }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-llvm-cov-bin
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-bin-${{ runner.os }}-0.9.1

      - name: Install cargo-llvm-cov
        if: steps.cargo-llvm-cov-bin.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked --version 0.9.1

      - name: cargo llvm-cov (summary)
        # Explicit bash adds -o pipefail, so a failing test still fails through tee.
        shell: bash
        run: |
          {
            echo '### Rust coverage (report only)'
            echo '```text'
            cargo llvm-cov --locked
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: lcov report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Cobertura report
        run: cargo llvm-cov report --cobertura --output-path cobertura.xml

      - name: Upload lcov artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-lcov
          path: src-tauri/lcov.info
          retention-days: 14

      - name: Upload coverage to Code Quality
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: src-tauri/cobertura.xml
          language: Rust
          label: code-coverage/cargo-llvm-cov

  rust-cross:
    # Windows and macOS run the crate's tests too. Windows catches path and case-folding
    # behaviour; macOS runs the sips-based ingest fixtures (CMYK with a profile, JPEG 2000)
    # that skip on Linux. The repo is public, so standard runners cost no minutes.
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup component add clippy

      # rust-cache keeps compiled dependencies but drops this crate's own build
      # output and stale files, so each entry stays well under the old ~2.5 GB.
      # Only main saves; PRs restore from it, which keeps PR caches off the 10 GB quota.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

  typecheck-ts:
    name: Type check (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: tsc --noEmit (app and config files)
        run: pnpm typecheck

  lint-test-ts:
    name: Lint & test (TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Skin CSS is current
        run: pnpm skin:check

      - name: Skin literals (reader CSS and TSX)
        run: pnpm skin:lint

      - name: Vitest + coverage gate
        run: pnpm test:coverage

      - name: Upload coverage to Code Quality
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest
          # Required job: an upload problem warns instead of blocking the merge, and the
          # job does not wait for GitHub to process the report.
          fail-on-error: false
          wait-for-processing-timeout: 0

      - name: Production bundle (the build the CSP gate uses)
        run: pnpm build

  licenses:
    # The bundled notices come from cargo-about (Rust) and pnpm (npm). This job fails
    # when a dependency has a licence outside src-tauri/about.toml, or when the committed
    # THIRD_PARTY_LICENSES.generated.md is stale.
    name: Third-party licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup show

      - name: cargo-about version (package.json config.cargoAboutVersion)
        id: cargo-about-version
        run: |
          version=$(node -p 'require("./package.json").config?.cargoAboutVersion ?? ""')
          if [ -z "$version" ]; then
            echo "::error::package.json is missing config.cargoAboutVersion"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-about-bin
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-${{ runner.os }}-${{ steps.cargo-about-version.outputs.version }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Install cargo-about
        if: steps.cargo-about-bin.outputs.cache-hit != 'true'
        env:
          CARGO_ABOUT_VERSION: ${{ steps.cargo-about-version.outputs.version }}
        run: cargo install cargo-about --locked --version "$CARGO_ABOUT_VERSION" --features cli

      - name: Notices are current
        run: pnpm licenses:check

  audit:
    # Real gate (not advisory). Informational cargo-audit warnings do not fail.
    # A vulnerability fails the job, and so does an audit that did not complete.
    # Time-bound ignores: src-tauri/.cargo/audit.toml (+ audit-exceptions.toml).
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          # Respects rust-toolchain.toml (pinned channel).
          rustup show

      - name: pnpm audit --prod
        # Registry 503s and client timeouts are retried inside the script, then it
        # fails closed. A flake must read as infrastructure, never as a clean audit.
        run: bash ci/scripts/pnpm-audit.sh

      # Cache the cargo-audit binary; compiling it from crates.io is ~3 minutes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-audit-bin
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.22.2

      - name: Install cargo-audit
        if: steps.cargo-audit-bin.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
