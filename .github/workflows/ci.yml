# ci.yml — fast-lane required checks for Scriptorium.
# Target: under ~5 minutes on a cold runner.
# Slow lane (Semgrep schedule): .github/workflows/security.yml
# Action refs are pinned to full commit SHAs; trailing comments keep Dependabot updates working.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy (file size, docs, backlog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: File size & counts (all tracked files)
        run: |
          git ls-files -z | xargs -0 python hooks/scripts/check_file_size.py

      - name: Living backlog size
        run: python hooks/scripts/check_todo_limits.py to_do.md

      - name: Backlog ↔ plans sync (advisory)
        run: python hooks/scripts/check_todo_plan_sync.py to_do.md || true

      - name: Internal documentation links
        run: python ci/scripts/check_doc_links.py --internal-only --strict

      - name: Cargo-audit exception expiry (required)
        run: python ci/scripts/check_audit_exceptions.py

      - name: Doc freshness (advisory on PR)
        if: github.event_name == 'pull_request'
        env:
          POLICY_WARN_AS_ERROR: "0"
        run: |
          git ls-files '*.md' | xargs -r python hooks/scripts/check_doc_freshness.py || true

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Ruff lint (incl. complexity)
        run: |
          pip install ruff==0.11.13
          ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "hooks/scripts scripts"
          severity: warning

      - name: Markdownlint (maintained docs)
        run: >-
          npx --yes markdownlint-cli2@0.23.0
          "AGENTS.md" "README.md" "CHANGELOG.md" "CHANGELOG.dev.md" "to_do.md"
          "ci/**/*.md" "hooks/**/*.md" "inventory/**/*.md" "policies/**/*.md"
          "prompts/**/*.md" "templates/**/*.md" "plans/**/*.md" "docs/**/*.md"
          "tests/**/*.md"

      - name: Actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          files: .github/workflows/*.yml

      - name: Python policy scripts compile
        run: python -m compileall -q hooks/scripts ci/scripts tests

  typecheck:
    name: Type check (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: basedpyright
        run: |
          pip install basedpyright==1.29.4
          basedpyright

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: pytest + coverage gate
        run: |
          pip install pytest pytest-cov jsonschema rfc3339-validator
          pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks detect (full history)
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          mkdir -p /tmp/gitleaks && tar xzf "/tmp/${tarball}" -C /tmp/gitleaks gitleaks
          /tmp/gitleaks/gitleaks detect --redact --no-banner --exit-code 1 --verbose

  rust:
    name: Rust (src-tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Tauri Linux system deps
        # Job default cwd is src-tauri; apt needs the runner root (any cwd is fine).
        # https://v2.tauri.app/start/prerequisites/#linux
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        run: |
          # Respects rust-toolchain.toml (pinned channel + clippy/rustfmt).
          rustup show
          rustup component add clippy rustfmt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo check
        run: cargo check

  typecheck-ts:
    name: Type check (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: tsc --noEmit
        run: pnpm exec tsc --noEmit

  audit:
    # Real gate (not advisory): fails on vulnerability findings only.
    # Informational cargo-audit warnings (unmaintained, etc.) do not fail.
    # Time-bound ignores: src-tauri/.cargo/audit.toml (+ audit-exceptions.toml).
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        run: |
          # Respects rust-toolchain.toml (pinned channel).
          rustup show

      - name: pnpm audit --prod
        run: |
          corepack enable && corepack prepare pnpm@11.17.0 --activate
          pnpm audit --prod

      # Cache the cargo-audit binary; compiling it from crates.io is ~3 minutes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-audit-bin
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.22.2

      - name: Install cargo-audit
        if: steps.cargo-audit-bin.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
