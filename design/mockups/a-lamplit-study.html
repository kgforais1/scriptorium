<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scriptorium · Lamplit Study</title>
<!--
  Scriptorium — Direction A, "Lamplit study".
  Look-and-feel mockup. Single file, no network: the desk, leather, paper, pages and
  page curl are all generated at runtime (WebGL2 shaders + Canvas 2D).
  Debug params: ?ui=1 keeps the toolbar visible, ?turn=0.35 freezes a page mid-turn,
  ?lore=0|1|2 opens a lore card, ?spread=N opens at spread N.
-->
<style>
  :root {
    --ink: #f3e6cf;
    --ink-dim: rgba(243, 230, 207, .62);
    --gold: #e2bd72;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #070504; }
  body {
    font-family: var(--serif); color: var(--ink);
    -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #gl.over-page { cursor: pointer; }
  #gl.over-corner { cursor: grab; }
  #gl.dragging { cursor: grabbing; }
  #gl.panning { cursor: move; }

  /* Lamp-on veil */
  #veil {
    position: fixed; inset: 0; background: #070504; pointer-events: none;
    transition: opacity 1.4s cubic-bezier(.3, .1, .2, 1);
  }
  #veil.off { opacity: 0; }

  /* Floating toolbar */
  #toolbar {
    position: fixed; top: 18px; left: 50%; z-index: 20;
    display: flex; align-items: center; gap: 2px; padding: 5px;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(46, 32, 22, .74), rgba(20, 13, 9, .78));
    border: 1px solid rgba(236, 204, 150, .13);
    box-shadow: 0 14px 34px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .35),
                inset 0 1px 0 rgba(255, 236, 200, .07);
    backdrop-filter: blur(16px) saturate(1.25); -webkit-backdrop-filter: blur(16px) saturate(1.25);
    opacity: 0; transform: translate(-50%, -10px); pointer-events: none;
    transition: opacity .5s ease, transform .5s cubic-bezier(.2, .8, .2, 1);
  }
  body.ui #toolbar { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .tb-btn {
    height: 34px; min-width: 34px; padding: 0 11px; border: 0; border-radius: 999px;
    background: transparent; color: var(--ink); font: inherit; font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    cursor: pointer; transition: background .2s, color .2s;
  }
  .tb-btn.icon { padding: 0; }
  .tb-btn:hover { background: rgba(255, 226, 180, .09); }
  .tb-btn:active { background: rgba(255, 226, 180, .15); }
  .tb-btn:disabled { opacity: .35; cursor: default; background: transparent; }
  .tb-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6;
                stroke-linecap: round; stroke-linejoin: round; }
  .tb-btn.on { color: #f3cf86; background: rgba(243, 207, 134, .11); }
  .tb-sep { width: 1px; height: 20px; background: rgba(236, 204, 150, .15); margin: 0 5px; }
  .tb-title { font-style: italic; font-size: 15px; color: var(--ink); padding: 0 10px 0 4px; white-space: nowrap; }
  .tb-label {
    font-size: 13px; color: var(--ink-dim); white-space: nowrap; text-align: center;
    font-variant-numeric: oldstyle-nums proportional-nums; letter-spacing: .02em; min-width: 92px;
  }
  .tb-label b { color: var(--ink); font-weight: 400; }
  .tb-zoom { min-width: 46px; }

  #hint {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 5;
    font-size: 12.5px; letter-spacing: .08em; color: rgba(243, 230, 207, .5);
    white-space: nowrap; opacity: 0; transition: opacity .6s ease; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
  }
  body.ui #hint { opacity: 1; }
  #hint kbd { font: inherit; padding: 0 5px; border: 1px solid rgba(243, 230, 207, .25); border-radius: 4px; }

  /* Hotspots */
  .hotspot {
    position: fixed; left: 0; top: 0; width: 30px; height: 30px; margin: -15px 0 0 -15px; z-index: 6;
    border: 0; background: none; border-radius: 50%; cursor: pointer;
    transition: opacity .45s ease; will-change: transform;
  }
  .hotspot::before {
    content: ""; position: absolute; inset: 9px; border-radius: 50%;
    background: radial-gradient(circle, #fff6dc 0, #f3c970 38%, rgba(226, 178, 87, .25) 62%, rgba(226, 178, 87, 0) 74%);
    box-shadow: 0 0 14px 4px rgba(255, 205, 120, .42), 0 0 2px 1px rgba(60, 30, 5, .35);
    transition: transform .25s ease;
  }
  .hotspot::after {
    content: ""; position: absolute; inset: 4px; border-radius: 50%;
    border: 1px solid rgba(255, 218, 150, .8);
    animation: glint 3.2s ease-out infinite;
  }
  .hotspot:hover::before { transform: scale(1.35); }
  .hotspot.hidden { opacity: 0; pointer-events: none; }
  @keyframes glint {
    0% { transform: scale(.45); opacity: 0; }
    15% { opacity: .95; }
    75% { transform: scale(1.3); opacity: 0; }
    100% { opacity: 0; }
  }

  /* Lore card */
  #lore {
    position: fixed; left: 0; top: 0; width: 344px; z-index: 30;
    padding: 30px 30px 22px; color: #2a1c11;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .30  0 0 0 0 .16  0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      radial-gradient(120% 90% at 30% 20%, #f8efdc 0%, #efe2c6 60%, #e2cfa8 100%);
    border-radius: 3px;
    box-shadow: 0 34px 70px -12px rgba(0, 0, 0, .7), 0 10px 22px rgba(0, 0, 0, .4),
                inset 0 0 0 1px rgba(255, 255, 255, .35), inset 0 0 40px rgba(150, 105, 50, .18);
    opacity: 0; transform: translateY(8px) scale(.97); transform-origin: var(--ox, 0) 50%;
    transition: opacity .3s ease, transform .4s cubic-bezier(.2, .8, .2, 1);
    pointer-events: none;
  }
  #lore.open { opacity: 1; transform: none; pointer-events: auto; }
  #lore::before {
    content: ""; position: absolute; inset: 8px; pointer-events: none;
    border: 1px solid rgba(138, 96, 40, .38); border-radius: 1px;
    box-shadow: inset 0 0 0 3px rgba(239, 226, 198, .0), inset 0 0 0 4px rgba(138, 96, 40, .16);
  }
  #lore .arrow {
    position: absolute; width: 14px; height: 14px; top: var(--ay, 50%); margin-top: -7px;
    background: #f1e5ca; transform: rotate(45deg);
    box-shadow: -1px 1px 0 rgba(138, 96, 40, .0);
  }
  #lore.right .arrow { left: -7px; }
  #lore.left .arrow { right: -7px; }
  .lore-kicker { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: #8d2c1b; }
  .lore-title { font-size: 28px; font-style: italic; line-height: 1.1; margin: 8px 0 2px; color: #22150c; }
  .lore-orn { display: flex; align-items: center; gap: 10px; margin: 10px 0 12px; color: #a27a35; }
  .lore-orn::before, .lore-orn::after { content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(138, 96, 40, .5), transparent); }
  .lore-orn svg { width: 22px; height: 12px; fill: currentColor; }
  .lore-body { font-size: 15px; line-height: 1.58; color: #33220f; hyphens: auto; text-align: left; }
  .lore-body::first-letter {
    float: left; font-size: 46px; line-height: .86; padding: 4px 6px 0 0; color: #8d2c1b;
  }
  .lore-foot {
    margin-top: 14px; padding-top: 10px; font-size: 12.5px; font-style: italic; color: #6c5234;
    border-top: 1px solid rgba(138, 96, 40, .22); display: flex; justify-content: space-between; gap: 12px;
  }
  .lore-foot span:last-child { font-style: normal; letter-spacing: .12em; font-size: 10.5px; text-transform: uppercase; }
  .lore-close {
    position: absolute; top: 14px; right: 14px; width: 26px; height: 26px; border: 0; border-radius: 50%;
    background: transparent; color: #7b5a35; cursor: pointer; display: grid; place-items: center;
    transition: background .2s;
  }
  .lore-close:hover { background: rgba(138, 96, 40, .14); }
  .lore-close svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; }

  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: var(--ink-dim); font-style: italic; }
</style>
</head>
<body class="ui">
<canvas id="gl"></canvas>
<div id="hotspots"></div>

<div id="lore" role="dialog" aria-modal="false" aria-labelledby="lore-title">
  <div class="arrow"></div>
  <button class="lore-close" aria-label="Close note"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
  <div class="lore-kicker" id="lore-kicker"></div>
  <div class="lore-title" id="lore-title"></div>
  <div class="lore-orn"><svg viewBox="0 0 44 24"><path d="M22 3c3 5 9 7 14 6-3 3-8 4-12 2 2 3 2 7-2 10-4-3-4-7-2-10-4 2-9 1-12-2 5 1 11-1 14-6z"/></svg></div>
  <div class="lore-body" id="lore-body"></div>
  <div class="lore-foot"><span id="lore-foot"></span><span>Curator</span></div>
</div>

<nav id="toolbar" aria-label="Reader controls">
  <button class="tb-btn" id="tb-back" title="Back to library">
    <svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg><span>Library</span>
  </button>
  <div class="tb-sep"></div>
  <span class="tb-title">Liber Mirabilium</span>
  <div class="tb-sep"></div>
  <button class="tb-btn icon" id="tb-prev" title="Previous page (←)"><svg viewBox="0 0 16 16"><path d="M9.5 4L5.5 8l4 4"/></svg></button>
  <span class="tb-label" id="tb-pages"></span>
  <button class="tb-btn icon" id="tb-next" title="Next page (→)"><svg viewBox="0 0 16 16"><path d="M6.5 4l4 4-4 4"/></svg></button>
  <div class="tb-sep"></div>
  <button class="tb-btn icon" id="tb-zout" title="Zoom out (−)"><svg viewBox="0 0 16 16"><path d="M4 8h8"/></svg></button>
  <span class="tb-label tb-zoom" id="tb-zoom">100%</span>
  <button class="tb-btn icon" id="tb-zin" title="Zoom in (+)"><svg viewBox="0 0 16 16"><path d="M4 8h8M8 4v8"/></svg></button>
  <div class="tb-sep"></div>
  <button class="tb-btn on" id="tb-lore" title="Show curator notes (H)">
    <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><circle cx="8" cy="8" r="5.6" stroke-dasharray="2.2 2.2"/></svg><span>Notes</span>
  </button>
</nav>

<div id="hint">Drag a page corner or press <kbd>←</kbd> <kbd>→</kbd> to turn &nbsp;·&nbsp; click a glint for the curator’s note</div>
<div id="veil"></div>
<div id="nogl">This mockup needs WebGL 2.</div>

<script>
(() => {
'use strict';

/* ======================================================================================
   Constants & small utilities
   ====================================================================================== */
const SERIF = '"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif';
const W = 1.0, H = 1.44;          // page size (book units; 1 unit ≈ a 17 cm page)
const O = 0.05, C = 0.022;        // board overhang ("squares"), board thickness
const ZG = 0.006;                 // page block height at the gutter
const NS = 80, NT = 20, DS = W / NS;
const NPAGES = 12, NSPREADS = NPAGES / 2;
const TW = 1024, TH = Math.round(TW * H);
const BOOK_ANGLE = -0.012;        // the book lies slightly askew on the desk
const params = new URLSearchParams(location.search);

const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* ======================================================================================
   Page artwork (Canvas 2D). Gold leaf is written into the alpha channel (alpha < 1) so the
   page shader can make it glint as the page moves under the lamp.
   ====================================================================================== */
const INK = '#2a1a0e', RED = '#962d1b', BLUE = '#27457f';

function noiseCanvas(w, h, r, lo, hi) {
  const c = makeCanvas(w, h), g = c.getContext('2d'), im = g.createImageData(w, h), d = im.data;
  for (let i = 0; i < w * h; i++) { const v = lo + (hi - lo) * r(); d[i * 4] = v; d[i * 4 + 1] = v * 0.985; d[i * 4 + 2] = v * 0.95; d[i * 4 + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
}

function makePaperBase() {
  const c = makeCanvas(TW, TH), g = c.getContext('2d'), r = rng(7);
  g.fillStyle = '#ecdcbb'; g.fillRect(0, 0, TW, TH);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.globalCompositeOperation = 'multiply';
  for (const [div, lo, a] of [[3, .9, .55], [9, .9, .5], [28, .9, .5], [90, .9, .45], [260, .86, .5]]) {
    const n = noiseCanvas(Math.ceil(TW / div) + 3, Math.ceil(TH / div) + 3, r, lo * 255, 255);
    g.globalAlpha = a; g.drawImage(n, -div, -div, TW + 2 * div, TH + 2 * div);
  }
  g.globalAlpha = 1;
  // fibres
  g.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 1400; i++) {
    const x = r() * TW, y = r() * TH, len = 5 + r() * 24, a = r() * Math.PI * 2;
    g.strokeStyle = r() < .55 ? `rgba(120,88,48,${.04 + r() * .06})` : `rgba(255,251,238,${.08 + r() * .1})`;
    g.lineWidth = .5 + r() * .9;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a + .6) * len * .5, y + Math.sin(a + .6) * len * .5, x + Math.cos(a) * len, y + Math.sin(a) * len);
    g.stroke();
  }
  // per-pixel tooth
  const im = g.getImageData(0, 0, TW, TH), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - .5) * 13; d[i] += n; d[i + 1] += n; d[i + 2] += n * .9; }
  g.putImageData(im, 0, 0);
  // age: browner toward the edges
  g.globalCompositeOperation = 'multiply';
  const rg = g.createRadialGradient(TW * .5, TH * .48, TW * .25, TW * .5, TH * .5, TW * .95);
  rg.addColorStop(0, 'rgba(255,255,255,0)'); rg.addColorStop(1, 'rgba(196,150,96,.55)');
  g.fillStyle = rg; g.fillRect(0, 0, TW, TH);
  const edge = (x0, y0, x1, y1, a) => {
    const lg = g.createLinearGradient(x0, y0, x1, y1);
    lg.addColorStop(0, `rgba(150,100,52,${a})`); lg.addColorStop(1, 'rgba(150,100,52,0)');
    g.fillStyle = lg; g.fillRect(0, 0, TW, TH);
  };
  for (const [s, a] of [[16, .55], [70, .22]]) {
    edge(0, 0, s, 0, a); edge(TW, 0, TW - s, 0, a); edge(0, 0, 0, s, a); edge(0, TH, 0, TH - s, a);
  }
  g.globalCompositeOperation = 'source-over';
  return c;
}

const goldNoise = (() => {
  const c = makeCanvas(128, 128), g = c.getContext('2d'), im = g.createImageData(128, 128), r = rng(99);
  for (let i = 0; i < 128 * 128; i++) {
    const dark = r() < .55;
    im.data[i * 4] = dark ? 80 : 255; im.data[i * 4 + 1] = dark ? 46 : 244; im.data[i * 4 + 2] = dark ? 12 : 205;
    im.data[i * 4 + 3] = Math.floor(Math.pow(r(), 2.6) * 170);
  }
  g.putImageData(im, 0, 0); return c;
})();

function goldGrad(g, x, y, w, h) {
  const gr = g.createLinearGradient(x, y, x + w, y + h);
  gr.addColorStop(0, '#f7df93'); gr.addColorStop(.3, '#c99a40'); gr.addColorStop(.52, '#f2d27c');
  gr.addColorStop(.78, '#a8782c'); gr.addColorStop(1, '#e9c56c');
  return gr;
}

/** Draw gold-leaf shapes: paints them on the page and records them in the gold mask. */
function goldPass(P, fn) {
  const t = makeCanvas(TW, TH), tg = t.getContext('2d');
  fn(tg);
  tg.globalCompositeOperation = 'source-atop';
  tg.fillStyle = tg.createPattern(goldNoise, 'repeat'); tg.fillRect(0, 0, TW, TH);
  P.g.drawImage(t, 0, 0); P.mask.drawImage(t, 0, 0);
}

function drawSpaced(g, text, x, y, size, spacing, color, opts = {}) {
  g.font = `${opts.italic ? 'italic ' : ''}${opts.weight || ''} ${size}px ${SERIF}`;
  g.fillStyle = color; g.textAlign = 'left';
  const chars = [...text], ws = chars.map(ch => g.measureText(ch).width);
  const total = ws.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
  let cx = opts.align === 'left' ? x : opts.align === 'right' ? x - total : x - total / 2;
  chars.forEach((ch, i) => { g.fillText(ch, cx, y); cx += ws[i] + spacing; });
  return total;
}

function centerText(g, text, x, y, font, color) {
  g.font = font; g.fillStyle = color; g.textAlign = 'center'; g.fillText(text, x, y); g.textAlign = 'left';
}

const LAT = ('et in est ad cum non quod sed ut per enim autem quae qui sunt esse vero etiam hoc ex ab de sic nam ipse tamen ' +
  'inter igitur ergo atque neque caelum terra mundus stella stellae sidera luna sol orbis orbem ignis aqua aer natura naturae ' +
  'rerum corpus corpora motus lumen lux tenebrae umbra tempus annus dies nox caeli terrae aquas ventis montes maria flumina ' +
  'arbor herba animal homines deus numen aeternum magnum longe prope semper numquam saepe primum deinde postea antiquus ' +
  'veteres sapientes philosophi docent dicunt scribunt videntur apparet manifestum ratio causa causae principium finis forma ' +
  'materia spiritus anima mens oculis manu libro liber scriptum verba signum signa figura circulus linea punctum numerus ' +
  'mensura gradus ordo cursus via iter locus loco regio insula insulae oriens occidens septentrio meridies ventus calor ' +
  'frigus siccum humidum lapis aurum argentum ferrum plumbum sal sulphur virtus potentia occultus arcanum mirabile ' +
  'mirabilia secretum ostendit demonstrat probat narrat refert tradit ferunt quoque item praeterea denique scilicet ' +
  'videlicet quidem certe forte observatur nauigantes peregrini incolae memoriae proditum circa supra infra ultra citra').split(' ');

function latin(r, nSent, lead) {
  const toks = [];
  if (lead) lead.split(/\s+/).forEach(w => w && toks.push({ w }));
  for (let k = 0; k < nSent; k++) {
    const n = 6 + Math.floor(r() * 13);
    for (let i = 0; i < n; i++) {
      let w = LAT[Math.floor(r() * LAT.length)];
      if (i === 0) w = w[0].toUpperCase() + w.slice(1);
      if (i === n - 1) w += r() < .82 ? '.' : (r() < .5 ? ';' : ':');
      else if (r() < .1) w += ',';
      toks.push({ w });
    }
    if (r() < .07) toks.push({ para: true });
  }
  return toks;
}

/** Justified text setter. Returns the index of the first token not set. */
function setText(P, toks, x, y, w, maxLines, o = {}) {
  const g = P.g, size = o.size || 21, lh = o.lh || 29, r = P.r;
  const fN = `${size}px ${SERIF}`, fI = `italic ${size}px ${SERIF}`;
  const meas = t => { g.font = t.it ? fI : fN; return g.measureText(t.w).width; };
  g.font = fN; const sp = g.measureText(' ').width;
  let i = o.start || 0, line = 0, paraStart = false;
  g.textAlign = 'left';
  while (line < maxLines && i < toks.length) {
    const ind = (o.indentLines && line < o.indentLines) ? o.indentPx : 0;
    const lw = w - ind, row = []; let tw = 0, brk = false;
    if (paraStart) { const t = { w: '¶', red: true }; t.ww = meas(t); row.push(t); tw = t.ww; paraStart = false; }
    while (i < toks.length) {
      const t = toks[i];
      if (t.para) { i++; if (row.length) { brk = true; paraStart = true; break; } continue; }
      const ww = meas(t), need = tw + (row.length ? sp : 0) + ww;
      if (need > lw && row.length) break;
      row.push(Object.assign({}, t, { ww })); tw = need; i++;
    }
    const last = brk || i >= toks.length || o.ragged;
    let extra = (!last && row.length > 1) ? (lw - tw) / (row.length - 1) : 0;
    if (extra > sp * 3) extra = 0;
    let cx = x + ind;
    if (o.center) cx = x + (w - tw) / 2;
    for (const t of row) {
      g.font = t.it ? fI : fN; g.fillStyle = t.red ? RED : (t.blue ? BLUE : INK);
      g.globalAlpha = .84 + .16 * r();
      g.fillText(t.w, cx, y + line * lh);
      cx += t.ww + sp + extra;
    }
    line++;
  }
  g.globalAlpha = 1;
  return i;
}

function pageGeom(i) {
  const left = i % 2 === 0, inner = 88, outer = 134;
  const x0 = left ? outer : inner, w = TW - inner - outer;
  return { left, x0, w, x1: x0 + w, colW: (w - 34) / 2, col2: x0 + (w - 34) / 2 + 34 };
}

function runningHead(P, title) {
  const { g } = P, { left, x0, w, x1 } = pageGeom(P.i);
  drawSpaced(g, title, x0 + w / 2, 130, 19, 5, RED);
  g.font = `italic 21px ${SERIF}`; g.fillStyle = '#3c2817'; g.textAlign = left ? 'left' : 'right';
  g.fillText(String(41 + P.i), left ? x0 : x1, 130); g.textAlign = 'left';
  g.fillStyle = 'rgba(58,38,20,.55)'; g.fillRect(x0, 146, w, 1.6); g.fillRect(x0, 150, w, .8);
}

function catchword(P, word) {
  const { g } = P, { x1 } = pageGeom(P.i);
  g.font = `italic 19px ${SERIF}`; g.fillStyle = '#3c2817'; g.textAlign = 'right';
  g.fillText(word, x1, TH - 150); g.textAlign = 'left';
}

function stains(P, n) {
  const { g, r } = P;
  g.globalCompositeOperation = 'multiply';
  for (let k = 0; k < n; k++) {
    const x = r() * TW, y = r() * TH, rad = 1.5 + Math.pow(r(), 3) * 9;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `rgba(150,96,46,${.25 + r() * .35})`); gr.addColorStop(1, 'rgba(150,96,46,0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  if (r() < .6) { // a faint tide line
    const x = r() * TW, y = r() * TH, rad = 90 + r() * 160;
    const gr = g.createRadialGradient(x, y, rad * .7, x, y, rad);
    gr.addColorStop(0, 'rgba(170,120,60,0)'); gr.addColorStop(.92, 'rgba(170,120,60,.10)'); gr.addColorStop(1, 'rgba(170,120,60,0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  g.globalCompositeOperation = 'source-over';
}

function star(g, x, y, r1, r2, n, rot = -Math.PI / 2) {
  g.beginPath();
  for (let k = 0; k < n * 2; k++) {
    const rr = k % 2 ? r2 : r1, a = rot + k * Math.PI / n;
    k ? g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : g.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  g.closePath();
}

function textOnArc(g, text, cx, cy, rad, aCenter, size, color, spacing = 1) {
  g.font = `${size}px ${SERIF}`; g.fillStyle = color; g.textAlign = 'center';
  const chars = [...text], ws = chars.map(c => g.measureText(c).width + spacing);
  const total = ws.reduce((a, b) => a + b, 0);
  let a = aCenter - total / rad / 2;
  chars.forEach((ch, k) => {
    const aa = a + ws[k] / rad / 2;
    g.save(); g.translate(cx + Math.cos(aa) * rad, cy + Math.sin(aa) * rad); g.rotate(aa + Math.PI / 2);
    g.fillText(ch, 0, 0); g.restore();
    a += ws[k] / rad;
  });
  g.textAlign = 'left';
}

function vine(P, x, y, len, dir) {
  // penwork stem with ivy leaves running down the margin from an initial
  const { g, r } = P;
  g.strokeStyle = '#3a2412'; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(x, y);
  const pts = [];
  for (let k = 1; k <= 24; k++) {
    const t = k / 24, yy = y + t * len, xx = x + Math.sin(t * 9) * 9 * dir;
    g.lineTo(xx, yy); pts.push([xx, yy, t]);
  }
  g.stroke();
  pts.forEach(([xx, yy, t], k) => {
    if (k % 3) return;
    const s = k % 6 ? 1 : -1, lx = xx + s * 15, ly = yy + 4;
    g.beginPath(); g.moveTo(xx, yy); g.quadraticCurveTo(xx + s * 8, yy - 6, lx, ly); g.stroke();
    g.beginPath(); g.moveTo(lx, ly);
    g.bezierCurveTo(lx + s * 9, ly - 9, lx + s * 14, ly + 3, lx + s * 4, ly + 10);
    g.bezierCurveTo(lx - s * 2, ly + 8, lx - s * 3, ly + 3, lx, ly);
    g.fillStyle = k % 9 === 0 ? BLUE : (k % 9 === 3 ? '#4f6b33' : RED); g.fill();
    g.lineWidth = 1; g.stroke(); g.lineWidth = 1.6;
  });
  goldPass(P, tg => {
    tg.fillStyle = goldGrad(tg, x - 20, y, 40, len);
    pts.forEach(([xx, yy], k) => { if (k % 3 === 1) { tg.beginPath(); tg.arc(xx - (k % 2 ? 9 : -9) * dir, yy, 4.2, 0, 7); tg.fill(); } });
    tg.beginPath(); tg.arc(pts[pts.length - 1][0], pts[pts.length - 1][1] + 8, 7, 0, 7); tg.fill();
  });
  g.strokeStyle = '#3a2412'; g.lineWidth = 1;
  pts.forEach(([xx, yy], k) => { if (k % 3 === 1) { g.beginPath(); g.arc(xx - (k % 2 ? 9 : -9) * dir, yy, 4.2, 0, 7); g.stroke(); } });
}

function illuminatedInitial(P, letter, x, y, s) {
  const { g, r } = P;
  goldPass(P, tg => { tg.fillStyle = goldGrad(tg, x, y, s, s); tg.fillRect(x, y, s, s); tg.clearRect(x + 8, y + 8, s - 16, s - 16); });
  const ix = x + 8, iy = y + 8, is = s - 16;
  // split ground: ultramarine and rose, divided diagonally like a period initial
  g.fillStyle = '#1d3a78'; g.fillRect(ix, iy, is, is);
  g.save(); g.beginPath(); g.moveTo(ix + is, iy); g.lineTo(ix + is, iy + is); g.lineTo(ix, iy + is); g.closePath(); g.clip();
  g.fillStyle = '#9c3a3f'; g.fillRect(ix, iy, is, is); g.restore();
  // white filigree
  g.strokeStyle = 'rgba(244,238,222,.78)'; g.lineWidth = 1.2;
  for (let k = 0; k < 16; k++) {
    const cx = ix + 14 + r() * (is - 28), cy = iy + 14 + r() * (is - 28), rad = 5 + r() * 8;
    g.beginPath();
    for (let a = 0; a < 9; a += .2) { const rr = rad * (1 - a / 10); g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
    g.stroke();
  }
  g.fillStyle = 'rgba(244,238,222,.85)';
  for (let k = 0; k < 40; k++) { g.beginPath(); g.arc(ix + 6 + r() * (is - 12), iy + 6 + r() * (is - 12), 1.3, 0, 7); g.fill(); }
  // gold letter with ink outline
  const font = `bold ${Math.round(is * .96)}px ${SERIF}`;
  goldPass(P, tg => {
    tg.font = font; tg.textAlign = 'center'; tg.fillStyle = goldGrad(tg, ix, iy, is, is);
    tg.fillText(letter, ix + is / 2, iy + is * .84);
  });
  g.font = font; g.textAlign = 'center'; g.strokeStyle = '#2c1708'; g.lineWidth = 2.2;
  g.strokeText(letter, ix + is / 2, iy + is * .84); g.textAlign = 'left';
  g.strokeStyle = '#3b1c0c'; g.lineWidth = 1.6; g.strokeRect(x + .8, y + .8, s - 1.6, s - 1.6); g.strokeRect(ix, iy, is, is);
  vine(P, x - 30, y + 30, 640, 1);
}

function penInitial(P, letter, x, y, size, color) {
  const { g } = P;
  g.font = `${size}px ${SERIF}`; g.fillStyle = color; g.fillText(letter, x, y);
  const w = g.measureText(letter).width;
  g.strokeStyle = color === RED ? BLUE : RED; g.lineWidth = 1;
  for (let k = 0; k < 7; k++) {
    const yy = y - size * .8 + k * size * .2;
    g.beginPath(); g.moveTo(x - 6, yy);
    g.bezierCurveTo(x - 22, yy + 4, x - 16, yy + 14, x - 8, yy + 10); g.stroke();
  }
  g.beginPath(); g.moveTo(x - 10, y + 4); g.bezierCurveTo(x - 14, y + 60, x - 2, y + 120, x - 12, y + 190); g.stroke();
  for (let k = 0; k < 6; k++) { const yy = y + 20 + k * 30; g.beginPath(); g.arc(x - 10 + Math.sin(k) * 3, yy, 3, 0, 7); g.stroke(); }
  return w;
}

/* ---------- individual pages ---------- */
function marbled(P, seed) {
  const { g } = P, r = rng(seed), im = g.getImageData(0, 0, TW, TH), d = im.data;
  const pal = [[29, 40, 78], [142, 48, 38], [198, 158, 82], [232, 220, 192], [24, 28, 40], [70, 96, 120]];
  const ph = Array.from({ length: 6 }, () => r() * 6.28);
  for (let y = 0; y < TH; y++) {
    const v = y / TH;
    for (let x = 0; x < TW; x++) {
      const u = x / TW;
      let f = v * 22 + 1.4 * Math.sin(u * 6.3 + v * 4 + ph[0]) + .8 * Math.sin(u * 15 + ph[1] + v * 9)
        + .35 * Math.sin(u * 41 + v * 3 + ph[2]) + .22 * Math.sin(u * 140 + ph[3]) * Math.sin(v * 30 + ph[4]);
      f += .5 * Math.sin(v * 70 + u * 12 + ph[5]);
      const b = f - Math.floor(f), idx = Math.floor(f) % 5, col = pal[(idx + 5) % 5];
      const vein = Math.max(0, 1 - Math.abs(b - .5) * 24);
      const k = (y * TW + x) * 4, m = .55 + .45 * (b < .5 ? 1 - b * .4 : .8 + b * .2);
      d[k] = d[k] * (1 - m) + (col[0] * (1 - vein) + 205 * vein) * m * (d[k] / 236);
      d[k + 1] = d[k + 1] * (1 - m) + (col[1] * (1 - vein) + 170 * vein) * m * (d[k + 1] / 220);
      d[k + 2] = d[k + 2] * (1 - m) + (col[2] * (1 - vein) + 110 * vein) * m * (d[k + 2] / 187);
    }
  }
  g.putImageData(im, 0, 0);
}

function page0(P) { // marbled paste-down with a bookplate
  marbled(P, 11);
  const { g } = P, x = 300, y = 520, w = 430, h = 300;
  g.save(); g.shadowColor = 'rgba(30,15,5,.35)'; g.shadowBlur = 8; g.shadowOffsetY = 2;
  g.fillStyle = '#efe2c4'; g.fillRect(x, y, w, h); g.restore();
  g.strokeStyle = INK; g.lineWidth = 2.5; g.strokeRect(x + 14, y + 14, w - 28, h - 28);
  g.lineWidth = .8; g.strokeRect(x + 20, y + 20, w - 40, h - 40);
  drawSpaced(g, 'EX LIBRIS', x + w / 2, y + 86, 30, 9, RED);
  centerText(g, 'Bibliothecae', x + w / 2, y + 138, `italic 30px ${SERIF}`, INK);
  drawSpaced(g, 'SCRIPTORIVM', x + w / 2, y + 190, 38, 6, INK);
  centerText(g, '❧  N° 1642  ❧', x + w / 2, y + 245, `italic 22px ${SERIF}`, '#5b3d22');
}

function page1(P) { // title page
  const { g } = P, cx = TW / 2 + 23;
  g.strokeStyle = INK; g.lineWidth = 3; g.strokeRect(120, 110, TW - 210, TH - 230);
  g.lineWidth = 1; g.strokeRect(132, 122, TW - 234, TH - 254);
  drawSpaced(g, 'LIBER', cx, 300, 36, 14, INK);
  drawSpaced(g, 'MIRABILIVM', cx, 400, 76, 8, RED);
  centerText(g, 'seu', cx, 458, `italic 32px ${SERIF}`, INK);
  drawSpaced(g, 'DE MVNDI ARCANIS', cx, 520, 38, 7, INK);
  centerText(g, 'tractatus, in quo caeli, terrae, marisque', cx, 580, `italic 26px ${SERIF}`, INK);
  centerText(g, 'secreta ex veterum libris explicantur.', cx, 614, `italic 26px ${SERIF}`, INK);
  g.fillStyle = INK; g.fillRect(cx - 160, 660, 320, 1.5);
  // printer's device: an oil lamp in a wreath
  const dy = 860;
  g.strokeStyle = INK; g.lineWidth = 2; g.beginPath(); g.arc(cx, dy, 112, 0, 7); g.stroke();
  g.lineWidth = .8; g.beginPath(); g.arc(cx, dy, 104, 0, 7); g.stroke();
  textOnArc(g, 'LVCET · ET · ARDET ·', cx, dy, 88, -Math.PI / 2, 17, RED, 2.5);
  for (let k = 0; k < 18; k++) {
    const a = Math.PI * .15 + k / 17 * Math.PI * .7, rr = 76;
    for (const s of [-1, 1]) {
      const aa = Math.PI / 2 + s * (a - Math.PI / 2) * 1, px = cx + Math.cos(aa) * rr, py = dy + Math.sin(aa) * rr;
      g.save(); g.translate(px, py); g.rotate(aa + s * .8);
      g.beginPath(); g.ellipse(0, 0, 9, 3.5, 0, 0, 7); g.fillStyle = '#3d5a2a'; g.fill(); g.restore();
    }
  }
  g.fillStyle = INK;
  g.beginPath(); g.moveTo(cx - 46, dy + 26); g.bezierCurveTo(cx - 40, dy + 2, cx + 20, dy + 2, cx + 52, dy + 6);
  g.lineTo(cx + 22, dy + 26); g.bezierCurveTo(cx + 10, dy + 36, cx - 30, dy + 38, cx - 46, dy + 26); g.fill();
  g.fillRect(cx - 14, dy + 34, 28, 6); g.fillRect(cx - 24, dy + 40, 48, 5);
  goldPass(P, tg => {
    tg.fillStyle = goldGrad(tg, cx + 30, dy - 50, 40, 60);
    tg.beginPath(); tg.moveTo(cx + 52, dy + 4); tg.bezierCurveTo(cx + 34, dy - 16, cx + 50, dy - 34, cx + 56, dy - 52);
    tg.bezierCurveTo(cx + 64, dy - 30, cx + 74, dy - 14, cx + 52, dy + 4); tg.fill();
  });
  drawSpaced(g, 'VENETIIS,', cx, 1090, 28, 6, INK);
  centerText(g, 'Apud Io. Scriptorium, ad signum Lucernae.', cx, 1136, `italic 25px ${SERIF}`, INK);
  drawSpaced(g, 'M. DC. XLII.', cx, 1200, 30, 8, RED);
}

function page2(P) { // celestial plate
  const { g, r } = P, cx = 535, cy = 730, R = 330;
  runningHead(P, 'DE MVNDO');
  drawSpaced(g, 'SYSTEMA MVNDI', cx, 222, 40, 7, RED);
  centerText(g, 'secundum veterum sententiam', cx, 262, `italic 24px ${SERIF}`, INK);
  const ring = (r0, r1, fill) => { g.beginPath(); g.arc(cx, cy, r0, 0, 7); g.arc(cx, cy, r1, 7, 0, true); g.fillStyle = fill; g.fill(); };
  ring(R, R - 46, 'rgba(58,86,140,.24)');
  ring(R - 46, R - 98, 'rgba(196,150,70,.26)');
  ring(62, 52, 'rgba(206,92,48,.28)'); ring(52, 44, 'rgba(150,190,210,.25)'); ring(44, 36, 'rgba(70,110,170,.25)');
  g.strokeStyle = INK;
  for (const [rad, lw] of [[R, 2.4], [R - 4, .8], [R - 46, 1.4], [R - 98, 1.4], [R - 104, .8], [62, 1], [52, .8], [44, .8], [36, 1.2]]) {
    g.lineWidth = lw; g.beginPath(); g.arc(cx, cy, rad, 0, 7); g.stroke();
  }
  for (let k = 0; k < 360; k += 2) {
    const a = k * Math.PI / 180, l = k % 10 === 0 ? 6 : 3;
    g.lineWidth = .7; g.beginPath();
    g.moveTo(cx + Math.cos(a) * (R - 98), cy + Math.sin(a) * (R - 98));
    g.lineTo(cx + Math.cos(a) * (R - 98 + l), cy + Math.sin(a) * (R - 98 + l)); g.stroke();
  }
  const signs = ['ARIES', 'TAVRVS', 'GEMINI', 'CANCER', 'LEO', 'VIRGO', 'LIBRA', 'SCORPIO', 'SAGITTAR.', 'CAPRICOR.', 'AQVARIVS', 'PISCES'];
  signs.forEach((s, k) => {
    const a = -Math.PI / 2 + k * Math.PI / 6;
    g.lineWidth = 1; g.beginPath();
    g.moveTo(cx + Math.cos(a) * (R - 46), cy + Math.sin(a) * (R - 46)); g.lineTo(cx + Math.cos(a) * (R - 92), cy + Math.sin(a) * (R - 92)); g.stroke();
    textOnArc(g, s, cx, cy, R - 78, a + Math.PI / 12, 17, k % 2 ? RED : INK, 1.5);
  });
  for (let k = 0; k < 70; k++) {
    const a = r() * Math.PI * 2, rr = R - 10 - r() * 30;
    star(g, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 2 + r() * 3.5, 1, 5, r());
    g.fillStyle = INK; g.fill();
  }
  const planets = [['Luna', 78, '#c9c3b0'], ['Mercurius', 106, '#9a8f7e'], ['Venus', 134, '#d8c58c'], ['Sol', 164, null],
    ['Mars', 192, '#b4523a'], ['Iuppiter', 216, '#c79a5a'], ['Saturnus', 238, '#7e7462']];
  planets.forEach(([name, rad, col], k) => {
    g.lineWidth = .9; g.setLineDash(k % 2 ? [] : [5, 4]); g.beginPath(); g.arc(cx, cy, rad, 0, 7); g.stroke(); g.setLineDash([]);
    const a = -2.1 + k * 0.83, px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
    if (col) {
      g.beginPath(); g.arc(px, py, 8, 0, 7); g.fillStyle = col; g.fill(); g.lineWidth = 1.2; g.stroke();
    } else {
      goldPass(P, tg => {
        tg.fillStyle = goldGrad(tg, px - 30, py - 30, 60, 60);
        star(tg, px, py, 30, 17, 16); tg.fill();
      });
      g.lineWidth = 1; star(g, px, py, 30, 17, 16); g.stroke();
      g.beginPath(); g.arc(px, py, 15, 0, 7); g.stroke();
      g.fillStyle = INK; g.beginPath(); g.arc(px - 5, py - 3, 1.6, 0, 7); g.arc(px + 5, py - 3, 1.6, 0, 7); g.fill();
      g.beginPath(); g.arc(px, py + 2, 6, .3, Math.PI - .3); g.stroke();
    }
    g.font = `italic 15px ${SERIF}`; g.fillStyle = INK; g.textAlign = 'center';
    g.fillText(name, px, py + (col ? 24 : 46)); g.textAlign = 'left';
  });
  // the Earth
  g.save(); g.beginPath(); g.arc(cx, cy, 36, 0, 7); g.clip();
  g.fillStyle = 'rgba(120,140,90,.35)'; g.fillRect(cx - 40, cy - 40, 80, 80);
  g.strokeStyle = 'rgba(42,26,14,.6)'; g.lineWidth = .8;
  for (let yy = -36; yy < 36; yy += 4) { g.beginPath(); g.moveTo(cx - 36, cy + yy); g.lineTo(cx + 36, cy + yy); g.stroke(); }
  g.restore();
  centerText(g, 'TERRA', cx, cy + 6, `15px ${SERIF}`, INK);
  // comet (later addition, breaking the ring)
  const hx = 784, hy = 422;
  for (let k = 0; k < 26; k++) {
    const a = -0.95 + (r() - .5) * .34, len = 90 + r() * 120;
    g.strokeStyle = `rgba(42,26,14,${.25 + r() * .4})`; g.lineWidth = .6 + r() * .8;
    g.beginPath(); g.moveTo(hx, hy);
    g.quadraticCurveTo(hx + Math.cos(a) * len * .5, hy + Math.sin(a) * len * .5 - 6, hx + Math.cos(a) * len, hy + Math.sin(a) * len - 14); g.stroke();
  }
  goldPass(P, tg => { tg.fillStyle = goldGrad(tg, hx - 14, hy - 14, 28, 28); star(tg, hx, hy, 14, 6, 8); tg.fill(); });
  g.strokeStyle = INK; g.lineWidth = 1; star(g, hx, hy, 14, 6, 8); g.stroke();
  centerText(g, 'Cometa', hx - 4, hy + 40, `italic 16px ${SERIF}`, RED);
  centerText(g, 'Fig. II.  Orbium caelestium ordo, cum stella vagante anni MDCXVIII.', cx, 1112, `italic 22px ${SERIF}`, INK);
  const toks = latin(r, 12, 'Haec figura ordinem orbium ostendit, quem veteres philosophi tradiderunt; terra in medio immota, circa eam elementa, deinde septem errantes, ultimo firmamentum cum signis.');
  setText(P, toks, 134, 1166, 802, 4, { size: 20, lh: 28 });
}

function page3(P) { // illuminated text page
  const { g, r } = P, { x0, w, colW, col2 } = pageGeom(3);
  runningHead(P, 'LIBER SECVNDVS');
  drawSpaced(g, 'DE MVNDO, ET AN FINITVS SIT.  CAP. I.', x0 + w / 2, 210, 21, 3.2, RED);
  illuminatedInitial(P, 'M', x0, 230, 196);
  const lead = 'VNDVM et hoc quodcumque nomine alio caelum appellare libuit, cuius circumflexu teguntur cuncta, numen esse credi par est, aeternum, inmensum, neque genitum neque interiturum umquam. Huius extera indagare nec interest hominum nec capit humanae coniectura mentis. Sacer est, aeternus, inmensus, totus in toto, immo vero ipse totum, infinitus ac finito similis, omnium rerum certus et similis incerto, extra intra cuncta conplexus in se, idemque rerum naturae opus et rerum ipsa natura.';
  const toks = latin(r, 60, lead);
  toks[0].red = false;
  let i = setText(P, toks, x0, 252, colW, 36, { indentLines: 7, indentPx: 212 });
  toks.splice(i, 0, { para: true });
  i = setText(P, toks, col2, 252, colW, 36, { start: i });
  catchword(P, 'mundus');
  // marginal gloss
  g.font = `italic 15px ${SERIF}`; g.fillStyle = '#4a3220';
  ['Plin. lib. II.', 'cap. i.'].forEach((t, k) => g.fillText(t, TW - 124, 300 + k * 20));
  g.fillStyle = 'rgba(120,70,40,.75)';
  ['nota bene', 'de comete', 'fol. 47'].forEach((t, k) => g.fillText(t, TW - 124, 760 + k * 20));
}

function page4(P) {
  const { g, r } = P, { x0, w, colW, col2, left } = pageGeom(4);
  runningHead(P, 'DE STELLIS');
  drawSpaced(g, 'DE STELLIS ERRANTIBVS.  CAP. II.', x0 + w / 2, 210, 21, 3.2, RED);

  const toks = latin(r, 70, 'VAE autem stellae errantes dicuntur, non quod errent, sed quod cursum suum vario modo peragant, nunc citius, nunc tardius.');
  let i = setText(P, toks, x0, 252, colW, 36, { indentLines: 3, indentPx: 84 });
  setText(P, toks, col2, 252, colW, 36, { start: i });
  g.font = `italic 15px ${SERIF}`; g.fillStyle = '#4a3220';
  ['Ptol. Alm.', 'lib. IX.'].forEach((t, k) => g.fillText(t, 22, 420 + k * 20));
  ['Saturnus', 'tardissimus.'].forEach((t, k) => g.fillText(t, 22, 980 + k * 20));
}

function armillary(P, cx, cy, R) {
  const { g } = P;
  g.strokeStyle = INK; g.lineWidth = 1.6;
  g.beginPath(); g.arc(cx, cy, R, 0, 7); g.stroke();
  g.lineWidth = 1; g.beginPath(); g.arc(cx, cy, R - 6, 0, 7); g.stroke();
  g.fillStyle = 'rgba(196,150,70,.3)';

function islandPts(cx, cy, rx, ry, r) {
  const ph = [r() * 6, r() * 6, r() * 6, r() * 6], pts = [];
  for (let k = 0; k < 220; k++) {
    const a = k / 220 * Math.PI * 2;
    const rr = 1 + .17 * Math.sin(2 * a + ph[0]) + .11 * Math.sin(3 * a + ph[1]) + .07 * Math.sin(6 * a + ph[2]) + .04 * Math.sin(13 * a + ph[3]) + (r() - .5) * .035;
    pts.push([cx + Math.cos(a) * rx * rr, cy + Math.sin(a) * ry * rr]);
  }
  return pts;
}
function trace(g, pts, s, cx, cy) {
  g.beginPath();
  pts.forEach(([x, y], k) => { const X = cx + (x - cx) * s, Y = cy + (y - cy) * s; k ? g.lineTo(X, Y) : g.moveTo(X, Y); });
  g.closePath();
}

const COMMON = `
precision highp float;
uniform vec3 uLampPos, uLampDir, uCamPos;
uniform vec2 uRes;
uniform float uLampInt, uExposure;
vec3 toLin(vec3 c){ return pow(c, vec3(2.2)); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.-2.*f);
  float a = hash12(i), b = hash12(i+vec2(1,0)), c = hash12(i+vec2(0,1)), d = hash12(i+vec2(1,1));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y); }
float fbm(vec2 p){ float s = 0., a = .5; mat2 m = mat2(1.6,1.2,-1.2,1.6);
  for (int i = 0; i < 5; i++){ s += a*vnoise(p); p = m*p + 17.1; a *= .5; } return s; }
const vec3 LAMP_COL = vec3(1.0, 0.82, 0.62);
vec3 lampRad(vec3 P, out vec3 L){
  vec3 d = uLampPos - P; float dist = length(d); L = d / dist;
  // a lamp-shade pool: soft elliptical falloff on the desk plane, centred up-left of the book
  vec2 q = (P.xy - vec2(-0.22, 0.14)) * vec2(0.80, 1.0);
  float pool = 1. - smoothstep(0.30, 2.05, length(q));
  pool = pool*pool*(3. - 2.*pool);
  pool = 0.07 + 0.93*pool;
  return LAMP_COL * uLampInt * pool / pow(dist, 1.5);
}
vec3 ambientRad(vec3 N){ return vec3(0.024, 0.018, 0.014) * (0.55 + 0.45*N.z); }
vec3 finish(vec3 col){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 q = (uv - vec2(0.47, 0.55)); q.x *= uRes.x / uRes.y;
  float vig = 1. - smoothstep(0.32, 1.05, length(q * vec2(0.82, 1.0)));
  col *= mix(0.22, 1.0, vig);
  col *= uExposure;
  col = (col*(2.51*col+0.03))/(col*(2.43*col+0.59)+0.14);
  col = pow(clamp(col, 0., 1.), vec3(1./2.2));
  col += (hash12(gl_FragCoord.xy + fract(uRes.x*0.1)) - 0.5) / 255.;
  return col;
}
`;

const HOTSPOTS = [
  { page: 2, u: 784 / TW, v: 422 / TH, kicker: 'Plate II · Later addition', title: 'Stella Vagans',
    body: 'In the autumn of 1618 three comets crossed the northern sky. The engraver added this one after the plate was cut, which is why its tail breaks clean through the zodiac ring. A later owner wrote beside it in brown ink: “seen from the abbey roof, the night the bells cracked.”',
    foot: 'See also Tabula VII' },
  { page: 3, u: (88 + 98) / TW, v: (230 + 98) / TH, kicker: 'Folio 44 · Illumination', title: 'The Lapis Initial',
    body: 'The blue ground is ultramarine, ground from Afghan lapis lazuli and once dearer than the gold beside it. Tilt the page toward the lamp: the leaf was laid on raised gesso and burnished with a dog’s tooth, so it still catches light four centuries on.',
    foot: 'Conservation report, 2019' },
  { page: 6, u: 420 / TW, v: 540 / TH, kicker: 'Tabula VII · Cartography', title: 'Insula Ferrea',
    body: 'No such island exists. Sailors told of a shoal that sent compass needles spinning, and the cartographer gave it a coastline anyway. Three later atlases copied it, each drawing it a little larger than the last.',
    foot: 'Phantom island · cf. Frisland' },
];
const hsLayer = document.getElementById('hotspots');
let showHotspots = true, openLore = -1;
const hsEls = HOTSPOTS.map((h, k) => {
  const b = document.createElement('button'); b.className = 'hotspot hidden'; b.setAttribute('aria-label', 'Curator note: ' + h.title);
  b.addEventListener('pointerdown', e => e.stopPropagation());
  b.addEventListener('click', e => { e.stopPropagation(); openLore === k ? closeLore() : showLore(k); });
  hsLayer.appendChild(b); return b;
});

function hotspotScreen(h) {
  const shown = pagesShown();
  let side;
  if (h.page === shown.left) side = -1; else if (h.page === shown.right) side = 1; else return null;
  const cv = side > 0 ? curR : curL, s = (side > 0 ? h.u : 1 - h.u) * W;
  const k = clamp(s / DS, 0, NS), i = Math.min(Math.floor(k), NS - 1), f = k - i;
  const x = cv.x[i] * (1 - f) + cv.x[i + 1] * f, z = cv.z[i] * (1 - f) + cv.z[i + 1] * f;
  return project([side * x, H / 2 - h.v * H, C + z + 0.002]);
}
function placeHotspots() {
  const turning = turn && turn.mode !== 'peek';
  HOTSPOTS.forEach((h, k) => {
    const el = hsEls[k], pos = turning ? null : hotspotScreen(h);
    if (!pos || !showHotspots) { el.classList.add('hidden'); return; }
    el.classList.remove('hidden');
    el.style.transform = `translate(${pos[0].toFixed(1)}px, ${pos[1].toFixed(1)}px)`;
    h.screen = pos;
  });
  if (openLore >= 0) positionLore();
}

const lore = document.getElementById('lore');
function showLore(k) {
  const h = HOTSPOTS[k]; openLore = k;
  document.getElementById('lore-kicker').textContent = h.kicker;
  document.getElementById('lore-title').textContent = h.title;
  document.getElementById('lore-body').textContent = h.body;
  document.getElementById('lore-foot').textContent = h.foot;
  positionLore();
  lore.classList.add('open');
}
function closeLore() { openLore = -1; lore.classList.remove('open'); }
function positionLore() {
  const h = HOTSPOTS[openLore]; if (!h.screen) return;
  const [x, y] = h.screen, cw = lore.offsetWidth, ch = lore.offsetHeight, gap = 26;
  const right = x + gap + cw < view.w - 16;
  const lx = right ? x + gap : x - gap - cw;
  const ly = clamp(y - ch * 0.42, 16, view.h - ch - 16);
  lore.classList.toggle('right', right); lore.classList.toggle('left', !right);
  lore.style.left = lx + 'px'; lore.style.top = ly + 'px';
  lore.style.setProperty('--ay', clamp(y - ly, 24, ch - 24) + 'px');
  lore.style.setProperty('--ox', right ? '0px' : '100%');
}
lore.querySelector('.lore-close').addEventListener('click', closeLore);
lore.addEventListener('pointerdown', e => e.stopPropagation());

const $ = id => document.getElementById(id);
function updateUI() {
  const s = turn ? turn.base + (turn.anim && turn.anim.to === (turn.dir > 0 ? 1 : 0) ? turn.dir : 0) : spread;
  $('tb-pages').innerHTML = `<b>${2 * s + 1}–${2 * s + 2}</b> of ${NPAGES}`;
  $('tb-prev').disabled = s <= 0; $('tb-next').disabled = s >= NSPREADS - 1;
  $('tb-zoom').textContent = Math.round(view.zoomT * 100) + '%';
  $('tb-lore').classList.toggle('on', showHotspots);
}
$('tb-prev').onclick = () => requestTurn(-1);
$('tb-next').onclick = () => requestTurn(1);
const setZoom = z => { view.zoomT = clamp(Math.round(z * 100) / 100, 0.6, 2.5); if (view.zoomT <= 1) view.panT = [0, 0]; updateUI(); };
$('tb-zin').onclick = () => setZoom(view.zoomT + 0.25);
$('tb-zout').onclick = () => setZoom(view.zoomT - 0.25);
$('tb-lore').onclick = () => { showHotspots = !showHotspots; if (!showHotspots) closeLore(); updateUI(); dirty = true; };
$('tb-back').onclick = () => { const v = $('veil'); v.classList.remove('off'); setTimeout(() => v.classList.add('off'), 900); };

let uiTimer = 0, overToolbar = false;
function pokeUI(ms = 2600) {
  document.body.classList.add('ui'); clearTimeout(uiTimer);
  if (params.get('ui') === '1') return;
  uiTimer = setTimeout(() => { if (!overToolbar) document.body.classList.remove('ui'); }, ms);
}
$('toolbar').addEventListener('pointerenter', () => { overToolbar = true; pokeUI(); });
$('toolbar').addEventListener('pointerleave', () => { overToolbar = false; pokeUI(); });

/* ======================================================================================
   Input
   ====================================================================================== */
let drag = null;
view.panT = [0, 0];
function hitPage(sx, sy) {
  const [x, y] = screenToLocal(sx, sy, C + 0.05);
  if (Math.abs(y) > H / 2 + 0.01 || Math.abs(x) > W + 0.01) return null;
  const side = x >= 0 ? 1 : -1;
  return { side, x, y, s: Math.abs(x), t: clamp((y + H / 2) / H, 0, 1), corner: Math.abs(x) > W * 0.8 };
}

canvas.addEventListener('pointerdown', e => {
  pokeUI();
  if (openLore >= 0) { closeLore(); return; }
  canvas.setPointerCapture(e.pointerId);
  const hit = hitPage(e.clientX, e.clientY);
  if (hit) {
    const dir = hit.side;
    if (turn && turn.mode === 'peek' && turn.dir !== dir) { turn = null; }
    if (turn && turn.mode !== 'peek') return;
    if (!turn && !beginTurn(dir, 'drag', hit.t)) return;
    turn.mode = 'drag'; turn.anim = null; turn.grabT = hit.t;
    drag = { kind: 'page', x0: e.clientX, y0: e.clientY, sGrab: Math.max(hit.s, 0.25), moved: false, lastP: turn.p, lastT: performance.now() };
  } else if (view.zoomT > 1) {
    drag = { kind: 'pan', x0: e.clientX, y0: e.clientY, pan0: view.panT.slice() };
    canvas.classList.add('panning');
  }
});
canvas.addEventListener('pointermove', e => {
  pokeUI();
  if (drag && drag.kind === 'page' && turn) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 5) drag.moved = true;
    if (!drag.moved) return;
    canvas.classList.add('dragging');
    const [x, y] = screenToLocal(e.clientX, e.clientY, C + 0.06);
    const p = progressForX(x, drag.sGrab);
    const now = performance.now(), dt = Math.max(1, now - drag.lastT);
    turn.vel = (p - drag.lastP) / dt * 1000; drag.lastP = p; drag.lastT = now;
    turn.p = p; turn.grabT = clamp((y + H / 2) / H, 0, 1);
    dirty = true;
    return;
  }
  if (drag && drag.kind === 'pan') {
    const k = view.pxWorld * view.dpr;
    view.panT = [drag.pan0[0] - (e.clientX - drag.x0) * k, drag.pan0[1] + (e.clientY - drag.y0) * k];
    const lim = 0.9 * (1 - 1 / view.zoomT) + 0.1;
    view.panT = [clamp(view.panT[0], -lim, lim), clamp(view.panT[1], -lim * .8, lim * .8)];
    return;
  }
  // hover: peek a corner
  const hit = hitPage(e.clientX, e.clientY);
  canvas.classList.toggle('over-page', !!hit && !hit.corner);
  canvas.classList.toggle('over-corner', !!hit && hit.corner);
  if (!turn && hit && hit.corner && canTurn(hit.side)) {
    beginTurn(hit.side, 'peek', hit.t);
    turn.anim = { from: turn.p, to: hit.side > 0 ? 0.09 : 0.91, t0: performance.now(), dur: 380, ease: easeOut };
    turn.mode = 'peek';
  } else if (turn && turn.mode === 'peek') {
    if (!hit || !hit.corner || hit.side !== turn.dir) {
      turn.mode = 'settle'; turn.anim = { from: turn.p, to: turn.dir > 0 ? 0 : 1, t0: performance.now(), dur: 300, ease: easeOut };
    } else { turn.grabT = hit.t; dirty = true; }
  }
});
function endDrag(e) {
  canvas.classList.remove('dragging', 'panning');
  if (!drag) return;
  if (drag.kind === 'page' && turn) {
    const done = turn.dir > 0 ? 1 : 0;
    if (!drag.moved) { animateTo(done, 0.95 * Math.abs(done - turn.p) + 0.1, easeInOut); }
    else {
      const proj = turn.p + turn.vel * 0.18;
      const complete = turn.dir > 0 ? proj > 0.5 : proj < 0.5;
      const target = complete ? done : 1 - done;
      animateTo(target, 0.25 + 0.6 * Math.abs(target - turn.p), easeOut);
      if (!complete) turn.mode = 'settle';
    }
    updateUI();
  }
  drag = null;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', () => {
  if (!drag && turn && turn.mode === 'peek') { turn.mode = 'settle'; turn.anim = { from: turn.p, to: turn.dir > 0 ? 0 : 1, t0: performance.now(), dur: 300, ease: easeOut }; }
});
canvas.addEventListener('wheel', e => {
  e.preventDefault(); pokeUI();
  if (e.ctrlKey || e.metaKey) setZoom(view.zoomT * Math.exp(-e.deltaY * 0.01));
  else if (view.zoomT > 1) {
    const k = view.pxWorld * view.dpr, lim = 0.9 * (1 - 1 / view.zoomT) + 0.1;
    view.panT = [clamp(view.panT[0] + e.deltaX * k, -lim, lim), clamp(view.panT[1] - e.deltaY * k, -lim * .8, lim * .8)];
  }
}, { passive: false });
canvas.addEventListener('dblclick', () => setZoom(view.zoomT > 1 ? 1 : 1.75));
window.addEventListener('keydown', e => {
  pokeUI();
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); requestTurn(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); requestTurn(-1); }
  else if (e.key === '+' || e.key === '=') setZoom(view.zoomT + 0.25);
  else if (e.key === '-' || e.key === '_') setZoom(view.zoomT - 0.25);
  else if (e.key === '0') setZoom(1);
  else if (e.key.toLowerCase() === 'h') $('tb-lore').click();
  else if (e.key === 'Escape') closeLore();
});
window.addEventListener('resize', resize);

/* ======================================================================================
   Main loop
   ====================================================================================== */
function frame(now) {
  requestAnimationFrame(frame);
  if (turn) { const before = turn.p; stepTurn(now); if (turn !== null || before !== undefined) dirty = true; }
  const zd = view.zoomT - view.zoom, pd0 = view.panT[0] - view.pan[0], pd1 = view.panT[1] - view.pan[1];
  if (Math.abs(zd) > 1e-4 || Math.abs(pd0) > 1e-5 || Math.abs(pd1) > 1e-5) {
    view.zoom += zd * 0.2; view.pan[0] += pd0 * 0.25; view.pan[1] += pd1 * 0.25;
    if (Math.abs(zd) < 1e-3) view.zoom = view.zoomT;
    updateCamera(); deskDirty = true; dirty = true;
  }
  if (!dirty) return;
  dirty = false;
  render();
}

window.__scriptorium = { get turn() { return turn; }, get spread() { return spread; }, hitPage };
function init() {
  const base = makePaperBase();
  const order = [2 * spread, 2 * spread + 1, ...Array.from({ length: NPAGES }, (_, i) => i)];
  for (const i of order) if (!pageTex[i]) pageTex[i] = uploadTexture(buildPage(i, base));
  resize(); refreshStacks(); updateUI();
  const tp = parseFloat(params.get('turn'));
  if (!isNaN(tp) && canTurn(1)) { beginTurn(1, 'drag', 0.12); turn.p = tp; }
  requestAnimationFrame(frame);
  requestAnimationFrame(() => $('veil').classList.add('off'));
  pokeUI(4500);
  const lk = parseInt(params.get('lore'), 10);
  if (!isNaN(lk)) setTimeout(() => { render(); showLore(lk); }, 60);
}
init();
})();
</script>
</body>
