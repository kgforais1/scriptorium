<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scriptorium — Gallery Daylight</title>
<style>
:root{
  --ink:#1f2529; --muted:rgba(31,37,41,.55); --faint:rgba(31,37,41,.36); --hair:rgba(31,37,41,.10);
  --accent:#3b6273; --glass:rgba(249,249,247,.74);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino","Palatino Linotype","Book Antiqua",Georgia,serif;
  --ease:cubic-bezier(.2,.75,.15,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#d6c6aa;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#table{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#stage{position:fixed;inset:0;z-index:1}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#light{position:fixed;inset:0;z-index:3;pointer-events:none;
  background:
    radial-gradient(120% 90% at 8% -12%, rgba(236,244,250,.20), rgba(236,244,250,0) 55%),
    radial-gradient(140% 120% at 50% 45%, rgba(20,30,40,0) 58%, rgba(20,30,40,.16) 100%);}

/* ---------- book ---------- */
#book{position:absolute;touch-action:none;transition:left .7s var(--ease),top .7s var(--ease),width .7s var(--ease),height .7s var(--ease)}
.board{position:absolute;border-radius:5px;
  background-color:#41525f;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.05), inset 0 1px 0 rgba(255,255,255,.10), inset 0 -1px 0 rgba(0,0,0,.18),
    0 1px 1px rgba(16,24,30,.30), 0 3px 6px rgba(16,24,30,.18), 10px 18px 26px rgba(22,32,40,.22), 26px 46px 90px rgba(22,32,40,.20);}
.board::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(90deg, rgba(255,255,255,.06), rgba(0,0,0,0) 8%, rgba(0,0,0,0) 46.5%, rgba(0,0,0,.28) 49.2%, rgba(255,255,255,.05) 50%, rgba(0,0,0,.28) 50.8%, rgba(0,0,0,0) 53.5%, rgba(0,0,0,0) 92%, rgba(0,0,0,.10)),
             linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,0) 30%, rgba(0,0,0,.08));}
.edge{position:absolute;pointer-events:none}
.edge.side{top:3px;bottom:1px;transition:width .5s var(--ease),left .5s var(--ease),right .5s var(--ease)}
.edge.side.l{background:linear-gradient(90deg, rgba(60,50,40,.22), rgba(60,50,40,0) 70%), repeating-linear-gradient(90deg,#efe9dc 0 1px,#d8cfbd 1px 1.6px,#e8e1d1 1.6px 2.4px);border-radius:3px 0 0 3px}
.edge.side.r{background:linear-gradient(270deg, rgba(60,50,40,.24), rgba(60,50,40,0) 70%), repeating-linear-gradient(90deg,#efe9dc 0 1px,#d8cfbd 1px 1.6px,#e8e1d1 1.6px 2.4px);border-radius:0 3px 3px 0}
.edge.bot{height:4px;background:linear-gradient(180deg,#d9d0be,#c9bfab);transition:left .5s var(--ease),right .5s var(--ease)}
.page{position:absolute;top:0;height:100%;overflow:hidden;background:#f3eddf}
.page canvas.pg{position:absolute;inset:0;width:100%;height:100%;display:none}
.page canvas.pg.on{display:block}
.page .gut{position:absolute;inset:0;background-size:100% 100%;pointer-events:none}
.crease{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:linear-gradient(90deg,rgba(40,30,22,.0),rgba(40,30,22,.35),rgba(40,30,22,0));pointer-events:none}

/* hotspots */
.hs{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;cursor:pointer;z-index:4;transition:opacity .35s ease, transform .35s var(--ease)}
.hs::before{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;
  background:rgba(255,255,255,.88);box-shadow:0 0 0 1px rgba(46,84,102,.45),0 1px 3px rgba(20,40,50,.25),0 0 10px rgba(255,255,255,.7)}
.hs::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;
  border:1px solid rgba(46,96,118,.55);animation:pulse 2.8s cubic-bezier(.2,.6,.3,1) infinite}
.hs.d1::after{animation-delay:.9s}.hs.d2::after{animation-delay:1.8s}
@keyframes pulse{0%{transform:scale(1);opacity:.85}70%{transform:scale(3.3);opacity:0}100%{transform:scale(3.3);opacity:0}}
.hs:hover{transform:scale(1.15)}
.hs.active::before{background:#3b6273;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 0 4px rgba(46,84,102,.35),0 2px 6px rgba(20,40,50,.3)}
.hs .tip{position:absolute;left:50%;bottom:30px;transform:translate(-50%,4px);white-space:nowrap;padding:5px 9px;border-radius:7px;
  background:rgba(250,250,248,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 14px rgba(20,30,40,.14),0 0 0 .5px rgba(20,30,40,.12);
  font:500 11px/1 var(--sans);letter-spacing:.02em;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .2s, transform .25s var(--ease)}
.hs:hover .tip{opacity:1;transform:translate(-50%,0)}
#book.turning .hs, body.hide-notes .hs{opacity:0;pointer-events:none}

/* ---------- chrome ---------- */
header{position:fixed;top:0;left:0;right:0;height:66px;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 28px;
  background:linear-gradient(180deg, rgba(247,247,244,.62), rgba(247,247,244,.0));}
.brand{display:flex;align-items:center;gap:11px}
.brand svg{opacity:.82}
.brand b{font:600 13px/1 var(--display);letter-spacing:.015em}
.brand span{font:400 12px/1 var(--sans);color:var(--muted);padding-left:11px;border-left:1px solid var(--hair)}
.title{position:absolute;left:50%;transform:translateX(-50%);text-align:center;transition:left .7s var(--ease)}
.title .t1{font:500 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase}
.title .t2{font:400 11.5px/1 var(--sans);color:var(--muted);margin-top:6px;letter-spacing:.01em}
.tools{display:flex;gap:4px}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:rgba(31,37,41,.72);transition:background .2s,color .2s}
.ib:hover{background:rgba(255,255,255,.55);color:var(--ink)}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}

#bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:5;height:60px;display:flex;align-items:center;gap:6px;padding:0 10px 0 18px;border-radius:16px;
  background:var(--glass);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.8),0 0 0 .5px rgba(30,40,50,.10),0 12px 34px rgba(30,40,50,.16),0 2px 6px rgba(30,40,50,.08);
  transition:left .7s var(--ease)}
.loc{width:150px;padding-right:8px}
.loc .a{font:500 12px/1.1 var(--sans);letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc .b{font:400 10.5px/1 var(--sans);color:var(--muted);margin-top:5px;letter-spacing:.06em;text-transform:uppercase}
.sep{width:1px;height:28px;background:var(--hair);margin:0 6px}
.thumbs{position:relative;display:flex;gap:7px;padding:0 4px;height:60px;align-items:center}
.th{position:relative;height:34px;border-radius:3px;cursor:pointer;opacity:.78;transition:transform .25s var(--ease),opacity .2s;
  box-shadow:0 0 0 .5px rgba(30,30,30,.18),0 1px 2px rgba(30,30,30,.12)}
.th canvas{display:block;height:34px;border-radius:3px}
.th:hover{opacity:1;transform:translateY(-3px)}
.th.on{opacity:1;box-shadow:0 0 0 1.5px var(--accent),0 2px 6px rgba(30,50,60,.2)}
.th .dot{position:absolute;top:-3px;right:-3px;width:6px;height:6px;border-radius:50%;background:#5b8799;box-shadow:0 0 0 1.5px rgba(250,250,248,.95)}
.track{position:absolute;left:4px;right:4px;bottom:7px;height:2px;border-radius:2px;background:rgba(31,37,41,.08)}
.track i{position:absolute;top:0;height:2px;border-radius:2px;background:var(--accent);transition:left .5s var(--ease),width .5s var(--ease)}
.notes-toggle{white-space:nowrap;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:10px;font:500 11.5px/1 var(--sans);color:rgba(31,37,41,.75)}
.notes-toggle:hover{background:rgba(255,255,255,.6)}
.notes-toggle .pip{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(46,84,102,.5),0 0 0 4px rgba(59,98,115,.12)}
body.hide-notes .notes-toggle .pip{background:transparent;box-shadow:0 0 0 1px rgba(31,37,41,.35)}

/* ---------- panel ---------- */
#panel{position:fixed;top:14px;right:14px;bottom:14px;width:384px;z-index:6;border-radius:18px;overflow:hidden;
  background:rgba(250,250,248,.86);backdrop-filter:blur(28px) saturate(1.3);-webkit-backdrop-filter:blur(28px) saturate(1.3);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.9),0 0 0 .5px rgba(30,40,50,.12),0 24px 60px rgba(25,35,45,.22),0 4px 12px rgba(25,35,45,.08);
  transform:translateX(calc(100% + 30px));transition:transform .65s var(--ease);display:flex;flex-direction:column}
body.panel-open #panel{transform:none}
.p-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 0 24px}
.kicker{font:600 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.p-body{flex:1;overflow:auto;padding:14px 24px 20px}
.p-body h2{font:500 23px/1.18 var(--display);letter-spacing:-.012em;margin:2px 0 6px}
.p-body .sub{font:italic 14px/1.4 var(--serif);color:var(--muted);margin-bottom:16px}
.detail{position:relative;border-radius:10px;overflow:hidden;background:#efe9db;box-shadow:0 0 0 .5px rgba(30,30,30,.14),0 6px 18px rgba(30,30,30,.10);margin-bottom:6px}
.detail canvas{display:block;width:100%}
.detail .zoom{position:absolute;right:8px;bottom:8px;padding:4px 7px;border-radius:6px;background:rgba(250,250,248,.85);font:500 10px/1 var(--sans);letter-spacing:.06em;color:var(--muted)}
.cap{font:400 11px/1.4 var(--sans);color:var(--faint);margin-bottom:18px}
.p-body p{font:400 13.5px/1.62 var(--sans);color:rgba(31,37,41,.86);margin-bottom:12px;letter-spacing:.003em}
.meta{margin-top:18px;border-top:1px solid var(--hair)}
.meta div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--hair);font:400 12px/1.3 var(--sans)}
.meta div span:first-child{color:var(--muted)}
.meta div span:last-child{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font:500 11px/1 var(--sans);padding:7px 10px;border-radius:20px;background:rgba(59,98,115,.08);color:#2f5262}
.p-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 14px 24px;border-top:1px solid var(--hair);font:400 11.5px/1 var(--sans);color:var(--muted)}
.p-foot .nav{display:flex;gap:2px}
</style>
</head>
<body>
<canvas id="table"></canvas>
<div id="stage">
  <div id="book">
    <div class="board"></div>
    <div class="edge side l" id="edgeL"></div><div class="edge side r" id="edgeR"></div>
    <div class="edge bot" id="edgeB"></div>
    <div class="page" id="slotL"><div class="gut" id="gutL"></div></div>
    <div class="page" id="slotR"><div class="gut" id="gutR"></div></div>
    <div class="crease" id="crease"></div>
  </div>
</div>
<canvas id="gl"></canvas>
<div id="light"></div>

<header>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1f2529" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.6 3.5 5v13c3.5-.4 6.5 0 8.5 1.5 2-1.5 5-1.9 8.5-1.5V5C17 4.6 14 5 12 6.5z"/><path d="M12 6.5v13"/></svg>
    <b>Scriptorium</b><span>Reading Room</span>
  </div>
  <div class="title" id="title"><div class="t1">The Hedgerow Flora</div><div class="t2">Margaret A. Hale · London, 1872</div></div>
  <div class="tools">
    <button class="ib" title="Contents"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
    <button class="ib" title="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></button>
    <button class="ib" title="Bookmark"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-3.5L7 20z"/></svg></button>
    <button class="ib" title="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</header>

<nav id="bar">
  <div class="loc"><div class="a" id="locA">Chapter I · Plate I</div><div class="b" id="locB">pp. 2–3 of 12</div></div>
  <button class="ib" id="prev" title="Previous (←)"><svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg></button>
  <div class="thumbs" id="thumbs"><div class="track"><i id="trackI"></i></div></div>
  <button class="ib" id="next" title="Next (→)"><svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg></button>
  <div class="sep"></div>
  <button class="notes-toggle" id="notesToggle" title="Show curator notes"><span class="pip"></span><span id="notesLabel">3 notes</span></button>
</nav>

<aside id="panel" aria-hidden="true">
  <div class="p-head"><div class="kicker" id="pKicker">Curator's note</div>
    <button class="ib" id="pClose" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="p-body" id="pBody"></div>
  <div class="p-foot"><span id="pCount">1 of 3 notes</span>
    <div class="nav"><button class="ib" id="pPrev"><svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg></button><button class="ib" id="pNext"><svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg></button></div></div>
</aside>

<script>
"use strict";
/* =====================================================================
   Scriptorium — Direction B "Gallery daylight" look-and-feel mockup.
   Everything is generated in this file: wood (GLSL), paper and plates
   (2D canvas), and the page curl (WebGL2 cylinder deformation).
   ===================================================================== */
const PW = 1000, PH = 1375, ASPECT = PW / PH;
const SERIF = "'Iowan Old Style','Palatino','Palatino Linotype','Book Antiqua',Georgia,serif";
const INK = "rgba(44,35,29,0.94)", PINK = "50,38,30";
const Q = new URLSearchParams(location.search);
const $ = s => document.querySelector(s);
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const FILTER_OK = (() => { try { const c = mk(2, 2).getContext("2d"); c.filter = "blur(1px)"; return c.filter === "blur(1px)"; } catch (e) { return false; } })();

/* ---------------------------------------------------------------- paper */
const paperTile = (() => {
  const S = 512, c = mk(S, S), x = c.getContext("2d"), id = x.createImageData(S, S), d = id.data, r = rng(11);
  for (let i = 0; i < S * S; i++) { const v = 128 + (r() - .5) * 22 + (r() - .5) * 10; d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255; }
  x.putImageData(id, 0, 0);
  x.lineCap = "round";
  for (let i = 0; i < 1400; i++) {
    const px = r() * S, py = r() * S, a = r() * Math.PI * 2, l = 4 + r() * 18;
    x.strokeStyle = r() < .5 ? "rgba(255,255,255,.10)" : "rgba(0,0,0,.08)"; x.lineWidth = .5 + r() * .7;
    x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a + .6) * l * .5, py + Math.sin(a + .6) * l * .5, px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke();
  }
  return c;
})();
function paper(ctx, seed, tone) {
  const r = rng(seed);
  ctx.fillStyle = tone || "#f4eee1"; ctx.fillRect(0, 0, PW, PH);
  // low frequency tone variation
  for (let i = 0; i < 9; i++) {
    const g = ctx.createRadialGradient(r() * PW, r() * PH, 0, r() * PW, r() * PH, 200 + r() * 500);
    g.addColorStop(0, `rgba(${r() < .5 ? "190,160,110" : "255,255,250"},${.025 + r() * .03})`); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, PW, PH);
  }
  ctx.save(); ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = .32;
  ctx.translate(-r() * 512, -r() * 512); ctx.fillStyle = ctx.createPattern(paperTile, "repeat"); ctx.fillRect(0, 0, PW + 512, PH + 512); ctx.restore();
  // edge toning, as in a real scan
  const e = ctx.createRadialGradient(PW / 2, PH / 2, PH * .42, PW / 2, PH / 2, PH * .78);
  e.addColorStop(0, "rgba(170,135,80,0)"); e.addColorStop(1, "rgba(170,135,80,.10)"); ctx.fillStyle = e; ctx.fillRect(0, 0, PW, PH);
  // a little foxing
  for (let i = 0; i < 5; i++) {
    const fx = r() * PW, fy = r() * PH, fr = 2 + r() * 6;
    const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr); g.addColorStop(0, "rgba(150,100,50,.10)"); g.addColorStop(1, "rgba(150,100,50,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(fx, fy, fr, 0, 7); ctx.fill();
  }
}

/* -------------------------------------------------------------- typography */
function spaced(ctx, text, x, y, sp, align) {
  let w = 0; for (const ch of text) w += ctx.measureText(ch).width + sp; w -= sp;
  let cx = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + sp; }
  return w;
}
function tokenize(str) {
  const words = []; let it = false;
  for (const raw of str.split(/\s+/).filter(Boolean)) {
    const segs = []; let buf = "";
    for (const ch of raw) { if (ch === "_") { if (buf) segs.push({ t: buf, it }); buf = ""; it = !it; } else buf += ch; }
    if (buf) segs.push({ t: buf, it });
    words.push(segs);
  }
  return words;
}
function fontFor(size, it) { return `${it ? "italic " : ""}${size}px ${SERIF}`; }
function wordW(ctx, segs, size) { let w = 0; for (const s of segs) { ctx.font = fontFor(size, s.it); w += ctx.measureText(s.t).width; } return w; }
function drawWord(ctx, segs, x, y, size) { for (const s of segs) { ctx.font = fontFor(size, s.it); ctx.fillText(s.t, x, y); x += ctx.measureText(s.t).width; } }
function textBlock(ctx, paras, o) {
  const size = o.size || 24, lh = o.lh || 35, starts = [];
  let y = o.y; ctx.fillStyle = INK; ctx.textBaseline = "alphabetic";
  ctx.font = fontFor(size); const space = ctx.measureText(" ").width;
  paras.forEach((para, pi) => {
    const words = tokenize(para); const drop = o.drop && pi === 0;
    let dropW = 0, dropLines = 3;
    if (drop) {
      const letter = words[0][0].t[0]; words[0][0].t = words[0][0].t.slice(1).toUpperCase();
      if (words[1]) words[1] = words[1].map(s => ({ t: s.t.toUpperCase(), it: s.it }));
      const ds = lh * 2.62; ctx.font = `${ds}px ${SERIF}`; dropW = ctx.measureText(letter).width + 10;
      ctx.fillText(letter, o.x - 2, y + size + lh * 2 - 1);
    }
    starts.push(y);
    const off = li => drop ? (li < dropLines ? dropW : 0) : (li === 0 ? (o.noIndent ? 0 : size * 1.4) : 0);
    let lines = [], cur = [], curW = 0;
    for (const w of words) {
      const ww = wordW(ctx, w, size), avail = o.w - off(lines.length);
      if (cur.length && curW + space + ww > avail) { lines.push({ ws: cur, w: curW }); cur = [{ s: w, w: ww }]; curW = ww; }
      else { curW += (cur.length ? space : 0) + ww; cur.push({ s: w, w: ww }); }
    }
    if (cur.length) lines.push({ ws: cur, w: curW, last: true });
    lines.forEach((ln, li) => {
      if (y + size > o.maxY) return;
      let x = o.x + off(li); const gaps = ln.ws.length - 1;
      let gap = space;
      if (!ln.last && gaps > 0) { const sum = ln.ws.reduce((a, b) => a + b.w, 0); gap = (o.w - off(li) - sum) / gaps; if (gap > space * 2.6) gap = space; }
      if (o.center) x = o.x + (o.w - ln.w) / 2;
      ln.ws.forEach(wd => { drawWord(ctx, wd.s, x, y + size, size); x += wd.w + gap; });
      y += lh;
    });

/* =====================================================================
   WebGL: page curl
   The turning leaf is a 64x88 grid. Each vertex is wrapped around a
   cylinder whose axis lies on the page; past half a turn it lies flat
   again, upside down. Lighting comes from the analytic normal. Cast
   shadow is the deformed leaf projected along the light, blurred at
   quarter resolution.
   ===================================================================== */

precision highp float;
in vec2 aUV;
uniform vec2 uPage, uSpine, uView, uA, uN, uShadowOff;
uniform float uMirror, uR, uCam, uShadow;
out vec2 vUV; out vec3 vNrm; out float vZ; out float vDist; out vec2 vPos;
void main(){
  vec2 p = aUV*uPage;
  float d = dot(p-uA, uN);
  vec2 q = p; float z = 0.; vec2 nz = vec2(0.,1.);
  if(d > 0.){
    float arc = 3.14159265*uR;
    if(d < arc){ float th = d/uR; q = p - uN*d + uN*(uR*sin(th)); z = uR*(1.-cos(th)); nz = vec2(-sin(th), cos(th)); }
    else { q = p - uN*d - uN*(d-arc); z = 2.*uR; nz = vec2(0.,-1.); }
  }
  vec3 n = vec3(uN*nz.x, nz.y); n.x *= uMirror;
  vec3 w = vec3(uSpine.x + uMirror*q.x, uSpine.y + q.y, z);
  vPos = w.xy; vZ = z; vDist = d; vNrm = n; vUV = aUV;
  if(uShadow > .5){ w.xy += uShadowOff*z; w.z = 0.; }
  vec2 c = w.xy - uView*.5;
  float wv = uCam - w.z;
  gl_Position = vec4(c.x*2./uView.x*uCam, -c.y*2./uView.y*uCam, -w.z/3000.*wv, wv);
}`;
const GUTTER_GLSL = `
vec2 gutter(float t){
  float ad = min(.9, .34*exp(-t/.016) + .13*exp(-t/.075) + .05*exp(-(1.-t)/.012));
  float al = .07*exp(-pow((t-.16)/.07, 2.));

const FS_SHEET = `#version 300 es

uniform sampler2D uFront, uBack;
uniform float uMirror, uFaceFlip, uR;
uniform vec2 uPage, uSpine;
out vec4 o;

  else { col = texture(uBack, uvB).rgb; N = -normalize(vNrm);

const FS_SHADOW = `#version 300 es
precision highp float;
in float vZ; in vec2 vUV; in vec3 vNrm; in float vDist; in vec2 vPos;
out vec4 o;
void main(){ float a = .62*smoothstep(0., 9., vZ)*(1. - .5*smoothstep(0., 360., vZ)); o = vec4(0., 0., 0., a); }`;

in vec2 vUv; uniform sampler2D uTex; uniform vec2 uDir; out vec4 o;

const FS_COMP = `#version 300 es
precision highp float;
in vec2 vUv; uniform sampler2D uTex;
uniform vec2 uView, uSpine, uPage, uA, uN; uniform float uMirror, uR;
out vec4 o;

  float a = texture(uTex, vUv).a;

const sheetProg = compile(gl, VS_SHEET, FS_SHEET);

/* ------------------------------------------------------------ turn model */
let T = null, raf = 0, queued = 0;
function bookGeom() {

function constrain(P, C, G) {

    const rr = Math.hypot(C.x - S[0], C.y - S[1]), dx = P.x - S[0], dy = P.y - S[1], dd = Math.hypot(dx, dy);
    if (dd > rr) { P.x = S[0] + dx / dd * rr; P.y = S[1] + dy / dd * rr; }

}
function fold(C, P, G) {
  const dx = C.x - P.x, dy = C.y - P.y, d = Math.hypot(dx, dy);
  if (d < .5) return { A: [G.W + 50, 0], N: [1, 0], R: .5 };
  const nx = dx / d, ny = dy / d, t = Math.min(d / (2 * G.W), 1);
  const R = Math.min(.4 + G.W * .19 * Math.pow(Math.sin(Math.PI * t), .8), .4 + d * .22);

function canTurn(dir) { return dir > 0 ? spread < N_SPREADS - 1 : spread > 0; }
function beginTurn(dir, to, C, mode) {

  if (dir > 0) { T.front = pageTex[2 * from + 1]; T.back = pageTex[2 * to]; T.under = [2 * from, 2 * to + 1]; }
  else { T.front = pageTex[2 * from]; T.back = pageTex[2 * to + 1]; T.under = [2 * to, 2 * from + 1]; }

}
function animateTo(complete, speed = 1) {
  const G = bookGeom();
  T.mode = "anim"; T.complete = complete; T.t0 = performance.now(); T.P0 = { ...T.P };
  T.E = complete ? { x: -G.W, y: T.C.y } : { ...T.C };

  T.dur = (complete ? 420 + 640 * frac : 240 + 320 * frac) / speed;
  T.lift = complete ? (T.C.y > G.H * .6 ? -1 : T.C.y < G.H * .4 ? 1 : 0) * G.H * .045 * frac : 0;

function endTurn(done) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, glc.width, glc.height); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  if (done) spread = T.to;
  showPages(2 * spread, 2 * spread + 1);
  book.classList.remove("turning");
  T = null; updateUI(); updateEdges();
  if (queued) { const q = queued; queued = 0; goTo(spread + q, 1.6); }
}
const ease = s => s < .5 ? 4 * s * s * s : 1 - Math.pow(-2 * s + 2, 3) / 2;
function kick() { if (!raf) raf = requestAnimationFrame(tick); }
function tick(now) {
  raf = 0; if (!T) return;
  const G = bookGeom(), dt = Math.min(64, now - T.last); T.last = now;
  if (T.mode === "anim") {
    const s = Math.min(1, (now - T.t0) / T.dur), e = ease(s);
    T.P.x = T.P0.x + (T.E.x - T.P0.x) * e; T.P.y = T.P0.y + (T.E.y - T.P0.y) * e + T.lift * Math.sin(Math.PI * e);
    constrain(T.P, T.C, G);

  } else if (T.mode !== "frozen") {

    T.P.x += (T.target.x - T.P.x) * k; T.P.y += (T.target.y - T.P.y) * k; constrain(T.P, T.C, G);

  }

}
function setSheetUniforms(prog, G, F) {
  const u = prog.u;
  gl.uniform2f(u.uPage, G.W, G.H); gl.uniform2f(u.uSpine, G.sx, G.ty); gl.uniform2f(u.uView, innerWidth, innerHeight);
  gl.uniform2f(u.uA, F.A[0], F.A[1]); gl.uniform2f(u.uN, F.N[0], F.N[1]); gl.uniform1f(u.uR, F.R);
  gl.uniform1f(u.uMirror, T.dir); gl.uniform1f(u.uCam, Math.max(innerWidth, innerHeight) * 2.8);

function render(G) {

  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[0].f); gl.viewport(0, 0, fbo[0].w, fbo[0].h);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
  gl.enable(gl.BLEND); gl.blendEquation(gl.MAX); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(shadowProg.p); setSheetUniforms(shadowProg, G, F); gl.uniform1f(shadowProg.u.uShadow, 1);
  gl.bindVertexArray(vao); gl.drawElements(gl.TRIANGLES, MX * MY * 6, gl.UNSIGNED_SHORT, 0);
  gl.blendEquation(gl.FUNC_ADD); gl.disable(gl.BLEND);
  // 2. separable blur
  gl.bindVertexArray(emptyVao); gl.useProgram(blurProg.p); gl.activeTexture(gl.TEXTURE0); gl.uniform1i(blurProg.u.uTex, 0);
  const bs = 1.5 + F.R / G.W * 6;
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[1].f); gl.bindTexture(gl.TEXTURE_2D, fbo[0].t); gl.uniform2f(blurProg.u.uDir, bs / fbo[0].w, 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[0].f); gl.bindTexture(gl.TEXTURE_2D, fbo[1].t); gl.uniform2f(blurProg.u.uDir, 0, bs / fbo[0].h); gl.drawArrays(gl.TRIANGLES, 0, 3);
  // 3. composite shadow + contact occlusion onto the screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, glc.width, glc.height);
  gl.clearColor(0, 0, 0, 0); gl.clearDepth(1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(compProg.p); gl.bindTexture(gl.TEXTURE_2D, fbo[0].t); gl.uniform1i(compProg.u.uTex, 0);
  gl.uniform2f(compProg.u.uView, innerWidth, innerHeight); gl.uniform2f(compProg.u.uSpine, G.sx, G.ty); gl.uniform2f(compProg.u.uPage, G.W, G.H);
  gl.uniform2f(compProg.u.uA, F.A[0], F.A[1]); gl.uniform2f(compProg.u.uN, F.N[0], F.N[1]); gl.uniform1f(compProg.u.uMirror, T.dir); gl.uniform1f(compProg.u.uR, F.R);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disable(gl.BLEND);
  // 4. the leaf itself
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  gl.useProgram(sheetProg.p); setSheetUniforms(sheetProg, G, F); gl.uniform1f(sheetProg.u.uShadow, 0);
  gl.uniform1f(sheetProg.u.uFaceFlip, -T.dir);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T.front); gl.uniform1i(sheetProg.u.uFront, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, T.back); gl.uniform1i(sheetProg.u.uBack, 1);
  gl.bindVertexArray(vao); gl.drawElements(gl.TRIANGLES, MX * MY * 6, gl.UNSIGNED_SHORT, 0);
  gl.bindVertexArray(null); gl.activeTexture(gl.TEXTURE0); gl.disable(gl.DEPTH_TEST);
  // swap the page underneath in the same frame the leaf first appears

}
function goTo(s, speed = 1) {
  if (s < 0 || s >= N_SPREADS || s === spread) return;
  if (T) { if (T.mode === "anim") queued = Math.sign(s - spread); return; }
  const dir = Math.sign(s - spread), G = bookGeom();
  beginTurn(dir, s, { x: G.W, y: G.H * .985 }, "anim"); animateTo(true, speed);
}

/* ------------------------------------------------------------ pointer */
let down = null;
function local(e, dir, G) { return { x: (e.clientX - G.sx) * dir, y: e.clientY - G.ty }; }
book.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  const G = bookGeom(), dir = e.clientX >= G.sx ? 1 : -1;
  if (T && T.mode === "anim") return;
  if (T && T.dir !== dir) endTurn(false);
  if (!T && !canTurn(dir)) return;
  book.setPointerCapture(e.pointerId);
  const l = local(e, dir, G);
  down = { dir, x: e.clientX, y: e.clientY, l, t: performance.now(), moved: false, vx: 0, lastX: e.clientX, lastT: performance.now() };
});
book.addEventListener("pointermove", e => {
  const G = bookGeom();
  if (down) {
    const dist = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    if (!down.moved && dist > 5) {
      down.moved = true;
      if (!T) { const gy = down.l.y > G.H * .8 ? G.H : down.l.y < G.H * .2 ? 0 : down.l.y; beginTurn(down.dir, spread + down.dir, { x: G.W, y: gy }, "drag"); }
      T.mode = "drag"; T.leaving = false; T.grab = { x: T.P.x - down.l.x, y: T.P.y - down.l.y };
    }
    if (down.moved && T) {
      const l = local(e, down.dir, G); T.target = { x: l.x + T.grab.x, y: l.y + T.grab.y };
      const now = performance.now(); down.vx = ((e.clientX - down.lastX) * down.dir) / Math.max(1, now - down.lastT); down.lastX = e.clientX; down.lastT = now;
      kick();
    }
    return;
  }
  // hover: lift the corner a little to invite a turn
  if (T && T.mode !== "peek") return;
  const dir = e.clientX >= G.sx ? 1 : -1, l = local(e, dir, G);
  const zone = G.W * .16;
  let C = null;
  for (const cy of [G.H, 0]) if (Math.hypot(G.W - l.x, cy - l.y) < zone && l.x <= G.W + 4) C = { x: G.W, y: cy };

  if (T && T.mode === "peek") {
    if (C && T.dir === dir && C.y === T.C.y) {

  }
});
book.addEventListener("pointerleave", () => { if (T && T.mode === "peek") { T.target = { ...T.C }; T.leaving = true; kick(); } });
function release(e) {
  if (!down) return; const d = down; down = null;
  const G = bookGeom();
  if (!d.moved) {
    if (T && T.mode === "peek") { animateTo(true); return; }
    if (canTurn(d.dir)) { const l = d.l; beginTurn(d.dir, spread + d.dir, { x: G.W, y: l.y < G.H * .5 ? 0 : G.H }, "anim"); animateTo(true); }
    return;
  }
  if (!T) return;
  const complete = T.P.x < G.W * .35 || d.vx < -.45;
  animateTo(complete && !(d.vx > .45));
}
book.addEventListener("pointerup", release);
book.addEventListener("pointercancel", release);
addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); goTo(spread + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goTo(spread - 1); }
  else if (e.key === "Escape" && panelOpen) closeNote();
});

/* ------------------------------------------------------------ boot */
let rt = 0;
function onResize() { layout(); resizeGL(); clearTimeout(rt); rt = setTimeout(drawTable, 60); updateUI(); if (T) kick(); }
addEventListener("resize", onResize);
layout(); resizeGL(); drawTable(); showPages(2 * spread, 2 * spread + 1); updateUI();

// review hooks: ?turn=0.45 freezes a page mid-turn, ?note=1 opens a curator note
if (Q.has("note")) openNote(+Q.get("note"));
if (Q.has("turn")) {
  requestAnimationFrame(() => {
    const G = bookGeom(), s = +Q.get("turn"), back = Q.get("dir") === "back";
    const dir = back ? -1 : 1;
    beginTurn(dir, spread + dir, { x: G.W, y: Q.get("corner") === "top" ? 0 : G.H }, "frozen");
    const e = ease(s), lift = (Q.get("corner") === "top" ? 1 : -1) * G.H * .045;
    T.P = constrain({ x: G.W + (-2 * G.W) * e, y: T.C.y + lift * Math.sin(Math.PI * e) }, T.C, G);
    render(G);
  });
}
</script>
