# Local SonarQube Community Build scan ONLY (scripts/sonar_scan.sh).
#
# SonarQube Cloud automatic analysis ignores this file and reads
# .sonarcloud.properties instead. A local server has no LOC cap, so the scope
# here is deliberately wide: app code, harness scripts, and tests.
# The token and host come from the environment (SONAR_TOKEN, SONAR_HOST_URL);
# never put them in this file. See docs/sonarqube.md.
sonar.projectKey=scriptorium
sonar.projectName=Scriptorium
sonar.sourceEncoding=UTF-8

sonar.sources=src,src-tauri/src,src-tauri/build.rs,scripts,ci/scripts,hooks/scripts
sonar.tests=tests
sonar.python.version=3.11,3.12,3.13,3.14

# Used only when present: `pytest --cov --cov-report=xml` writes it.
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=\
  **/__pycache__/**,\
  **/node_modules/**,\
  .venv/**,\
  tmp/**,\
  dist/**,\
  src-tauri/target/**,\
  src-tauri/gen/**,\
  design/mockups/**,\
  htmlcov/**,\
  coverage.xml
sonar.cpd.exclusions=design/mockups/**
sonar.test.exclusions=tests/fixtures/**
