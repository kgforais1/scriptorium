# C libraries that Rust -sys crates vendor and compile into the app, plus the C
# libraries linked into the Tesseract sidecar. Read by
# ci/scripts/check_bundled_c_cves.py. Add one [[library]] per bundled library.
#
# source         "crate" (the default) reads a -sys crate; "script" reads a
#                repository script that pins the version
# crate          for source = "crate", the crate that bundles the C sources; its
#                locked version comes from src-tauri/Cargo.lock. Absent for
#                source = "script".
# version_file   file that states the C version: inside the crate source for
#                "crate", or relative to the repository root for "script"
# version_regex  regex run over that file; the capture groups are joined with "."
# cpe_vendor / cpe_product   the NVD CPE names used to look up CVEs
# canary_version / canary_cve   an older version and a CVE that NVD lists for it
#                under this exact CPE. The script queries it first and exits 2 if
#                the CVE is missing, because a wrong CPE returns zero CVEs and
#                would pass forever. Verify both against the live API. If no
#                canary exists, set canary = "none" and a canary_note instead
#                (the script warns on every run).
#
# Verified against the registry sources of the versions in Cargo.lock, and the
# script pins in scripts/build_tesseract.sh, on 2026-11-22.

[[library]]
name = "OpenJPEG"
crate = "openjpeg-sys"
version_file = "config/opj_config.h"
version_regex = '(?s)OPJ_VERSION_MAJOR\s+(\d+).*?OPJ_VERSION_MINOR\s+(\d+).*?OPJ_VERSION_BUILD\s+(\d+)'
cpe_vendor = "uclouvain"
cpe_product = "openjpeg"
canary_version = "2.3.0"
canary_cve = "CVE-2018-5727"

[[library]]
name = "Little CMS"
crate = "lcms2-sys"
# lcms2.h only carries major.minor (LCMS_VERSION 2190), so read the README.
version_file = "README.md"
version_regex = 'version (\d+\.\d+(?:\.\d+)?)'
cpe_vendor = "littlecms"
cpe_product = "little_cms"
canary_version = "2.14"
canary_cve = "CVE-2026-41254"

[[library]]
name = "Tesseract"
source = "script"
version_file = "scripts/build_tesseract.sh"
version_regex = '(?m)^TESSERACT_VERSION="(\d+\.\d+\.\d+)"'
cpe_vendor = "tesseract-ocr"
cpe_product = "tesseract_ocr"
canary_version = "4.1.1"
canary_cve = "CVE-2026-88047"

