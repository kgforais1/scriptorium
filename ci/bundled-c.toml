# C libraries that Rust -sys crates vendor and compile into the app.
# Read by ci/scripts/check_bundled_c_cves.py. Add one [[library]] per bundled library.
#
# crate          crate that bundles the C sources; its locked version comes from
#                src-tauri/Cargo.lock and its source from the cargo registry
# version_file   file inside the crate source that states the C version
# version_regex  regex run over that file; the capture groups are joined with "."
# cpe_vendor / cpe_product   the NVD CPE names used to look up CVEs
#
# Verified against the registry sources of the versions in Cargo.lock.

[[library]]
name = "OpenJPEG"
crate = "openjpeg-sys"
version_file = "config/opj_config.h"
version_regex = '(?s)OPJ_VERSION_MAJOR\s+(\d+).*?OPJ_VERSION_MINOR\s+(\d+).*?OPJ_VERSION_BUILD\s+(\d+)'
cpe_vendor = "uclouvain"
cpe_product = "openjpeg"

[[library]]
name = "Little CMS"
crate = "lcms2-sys"
# lcms2.h only carries major.minor (LCMS_VERSION 2190), so read the README.
version_file = "README.md"
version_regex = 'version (\d+\.\d+(?:\.\d+)?)'
cpe_vendor = "littlecms"
cpe_product = "little_cms_color_engine"

[[library]]
name = "AWS-LC"
crate = "aws-lc-sys"
version_file = "aws-lc/CMakeLists.txt"
version_regex = 'set\(SOFTWARE_VERSION "(\d+\.\d+\.\d+)"\)'
# NVD lists the C library as amazon:aws_libcrypto. Its Rust wrappers
# (amazon:aws-lc-sys, amazon:aws-lc-fips-sys) are separate CPEs keyed by crate
# version, and NVD has no amazon:aws-lc entry. Nothing was returned for 5.11.0
# when this was added; check that aws_libcrypto versions follow the AWS-LC
# version number before relying on a clean result.
cpe_vendor = "amazon"
cpe_product = "aws_libcrypto"
